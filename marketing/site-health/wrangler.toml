name = "gwenda-site-health"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "1c23e160e39a187ce33fe192595c4a7f"
workers_dev = false

# Public host (DNS + cert managed by Wrangler custom_domain)
routes = [
  { pattern = "health.gwenda.co.uk", custom_domain = true }
]

[observability]
enabled = true

[vars]
SITE_URL = "https://gwenda.co.uk"
# Prod's preview (drafts over published).
PREVIEW_SITE_URL = "https://preview.gwenda-blue.pages.dev"
ALERT_EMAIL = "alerts@gwenda.co.uk"
# Alerts go through the Gmail API as notifications@ (shared/mail-from.js);
# the Worker secret GMAIL_SERVICE_ACCOUNT_JSON is put by CI before each deploy.

[triggers]
crons = ["*/5 * * * *"]

# KV id is filled by `npm run setup:site-health`.
[[kv_namespaces]]
binding = "HEALTH_STATE"
id = "3dea240136ed48b19b5ae53fc94fbdb4"
