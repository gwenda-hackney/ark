name = "gwenda-subscribe-mailchimp-sync"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "1c23e160e39a187ce33fe192595c4a7f"

[vars]
BASEROW_API_URL = "https://api.baserow.io"
MAILCHIMP_AUDIENCE_ID = "e2c69d5d31"

[triggers]
crons = ["0 * * * *"]

# D1 (#127): the website database only, for subscribers. Unused until guests move.
[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "e5ac0a26-2c6c-4182-9230-073ea8f331b1"
