# Cloudflare Pages — the dev website (gwenda-web-dev), built from the Gwenda
# Dev Sanity copy for dev ops. main branch = live (published documents);
# the "preview" branch = preview (drafts over published). Password-gated like
# prod's preview. Form notifications go to alerts@ (config forms.notify_email),
# never the form's real address copied from prod.
name = "gwenda-web-dev"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
SITE_ENV = "dev"
SANITY_PROJECT_ID = "gwscpagy"
SANITY_DATASET = "production"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://gwenda-web-dev.pages.dev"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"

[env.preview.vars]
SITE_ENV = "dev"
SITE_PREVIEW = "true"
SANITY_PROJECT_ID = "gwscpagy"
SANITY_DATASET = "production"
SANITY_PERSPECTIVE = "previewDrafts"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://preview.gwenda-web-dev.pages.dev"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"
