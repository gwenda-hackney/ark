# Cloudflare Pages — the dev website (gwenda-web-dev), built from the Gwenda
# Dev Sanity copy for dev ops. main branch = live (published documents);
# the "preview" branch = preview (drafts over published). Password-gated like
# prod's preview. Form notifications go to alerts@ (config forms.notify_email),
# never the form's real address copied from prod.
name = "gwenda-web-dev"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
SITE_ENV = "dev"
SANITY_PROJECT_ID = "gwscpagy"
SANITY_DATASET = "production"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://gwenda-web-dev.pages.dev"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"

# D1 databases (#127, db/README.md): this account's own; ids from shared/d1-databases.js.
# Unused until each feature moves. Never `remote = true` here: ops:dev runs this file
# locally, so it gets a throwaway local database, never production's.
# [env.preview] doesn't inherit bindings, so they're repeated for it below.
[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "868113b6-d7bd-4e34-8ee9-5bf5438c50a1"

[[d1_databases]]
binding = "CONFIG_DB"
database_name = "gwenda-config"
database_id = "9123334a-25d7-4238-b478-dd5bd2499658"

[[d1_databases]]
binding = "OPS_DB"
database_name = "gwenda-ops"
database_id = "d3d5053d-45b7-48ba-b2f4-af5af109fbb3"

[env.preview.vars]
SITE_ENV = "dev"
SITE_PREVIEW = "true"
SANITY_PROJECT_ID = "gwscpagy"
SANITY_DATASET = "production"
SANITY_PERSPECTIVE = "previewDrafts"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://preview.gwenda-web-dev.pages.dev"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"

[[env.preview.d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "868113b6-d7bd-4e34-8ee9-5bf5438c50a1"

[[env.preview.d1_databases]]
binding = "CONFIG_DB"
database_name = "gwenda-config"
database_id = "9123334a-25d7-4238-b478-dd5bd2499658"

[[env.preview.d1_databases]]
binding = "OPS_DB"
database_name = "gwenda-ops"
database_id = "d3d5053d-45b7-48ba-b2f4-af5af109fbb3"
