<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mail test · Gwenda</title>
  <style>
    body { background: #0d0d0d; color: #e8e4dc; font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #c9a84c; font-weight: 500; }
    label { display: block; margin: .6rem 0 .2rem; color: #8a8680; }
    input, select, button { background: #1a1a1a; color: #e8e4dc; border: 1px solid #333; padding: .45rem .6rem; font: inherit; }
    input, select { width: 100%; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
    button { margin-top: 1rem; border-color: #c9a84c; color: #c9a84c; cursor: pointer; }
    button:disabled { opacity: .5; }
    pre { background: #141414; padding: .8rem; overflow-x: auto; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 13px; }
    td, th { border-bottom: 1px solid #222; padding: .35rem .4rem; text-align: left; vertical-align: top; }
    .ok { color: #7ab87a; } .fail { color: #c97a7a; }
  </style>
</head>
<body>
  <h1>Mail test</h1>
  <p>Each run sends a burst of emails inside one function call, on the same runtime and secrets as production.</p>
  <pre id="config">Loading config…</pre>

  <label for="to">To (@gwenda.co.uk only)</label>
  <input id="to" value="dscalamogna@gwenda.co.uk">
  <label for="from">From (blank uses the SMTP user)</label>
  <input id="from" placeholder="Gwenda &lt;play@gwenda.co.uk&gt;">
  <div class="row">
    <div><label for="mode">Transport</label>
      <select id="mode"><option value="smtp">SMTP (nodemailer)</option><option value="gmail">Gmail API (HTTPS)</option></select></div>
    <div><label for="count">Emails per run (max 10)</label><input id="count" type="number" min="1" max="10" value="3"></div>
    <div><label for="delay">Delay between (ms)</label><input id="delay" type="number" min="0" max="5000" value="0"></div>
    <div><label for="runs">Runs</label><input id="runs" type="number" min="1" max="10" value="1"></div>
  </div>
  <button id="go">Send</button>

  <p id="summary"></p>
  <table>
    <thead><tr><th>Run</th><th>#</th><th>Mode</th><th>Result</th><th>ms</th><th>Detail</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const $ = (id) => document.getElementById(id);
let ok = 0, fail = 0, runNo = 0;

fetch("/api/mail-test").then((r) => r.json()).then((c) => {
  $("config").textContent = JSON.stringify(c, null, 2);
}).catch((e) => { $("config").textContent = "Config failed: " + e.message; });

function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  const runs = Math.min(Math.max(Number($("runs").value) || 1, 1), 10);
  for (let r = 0; r < runs; r += 1) {
    runNo += 1;
    try {
      const res = await fetch("/api/mail-test", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mode: $("mode").value, to: $("to").value, from: $("from").value,
          count: $("count").value, delayMs: $("delay").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      for (const row of data.results) {
        row.ok ? ok++ : fail++;
        const detail = row.ok ? (row.response || row.id || "") : row.error;
        const log = row.log?.length ? "<pre>" + esc(row.log.join("\n")) + "</pre>" : "";
        $("rows").insertAdjacentHTML("afterbegin",
          `<tr><td>${runNo}</td><td>${row.attempt}</td><td>${data.mode}</td>` +
          `<td class="${row.ok ? "ok" : "fail"}">${row.ok ? "sent" : "failed"}</td>` +
          `<td>${row.ms}</td><td>${esc(detail)}${log}</td></tr>`);
      }
    } catch (e) {
      fail++;
      $("rows").insertAdjacentHTML("afterbegin",
        `<tr><td>${runNo}</td><td></td><td></td><td class="fail">request failed</td><td></td><td>${esc(e.message)}</td></tr>`);
    }
    $("summary").textContent = `Session: ${ok} sent, ${fail} failed`;
  }
  $("go").disabled = false;
});
</script>
</body>
</html>
