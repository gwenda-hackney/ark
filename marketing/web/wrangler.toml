# Cloudflare Pages — the website (gwenda). The release branch is the live site;
# the "preview" branch is its preview: drafts over published, password-gated.
# Everything else is the same environment, so preview forms behave like live.
# Vars sync on deploy via wrangler pages deploy (replaces ensure-pages-env.mjs).
# Secrets: scripts/ci/sync-pages-secrets.mjs (not stored in repo).
name = "gwenda"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
SITE_ENV = "production"
SANITY_PROJECT_ID = "pn5yjro6"
SANITY_DATASET = "production"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://gwenda.co.uk"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"

# D1 databases (#127, db/README.md): this account's own; ids from shared/d1-databases.js.
# Unused until each feature moves. Never `remote = true` here: ops:dev runs this file
# locally, so it gets a throwaway local database, never production's.
# [env.preview] doesn't inherit bindings, so they're repeated for it below.
[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "e5ac0a26-2c6c-4182-9230-073ea8f331b1"

[[d1_databases]]
binding = "CONFIG_DB"
database_name = "gwenda-config"
database_id = "af5ceb9e-edfb-40f1-a92c-54a7dbb3cd7b"

[[d1_databases]]
binding = "OPS_DB"
database_name = "gwenda-ops"
database_id = "2b070281-670d-412b-9da3-da906325ea74"

[env.preview.vars]
SITE_ENV = "production"
SITE_PREVIEW = "true"
SANITY_PROJECT_ID = "pn5yjro6"
SANITY_DATASET = "production"
SANITY_PERSPECTIVE = "previewDrafts"
ALERT_EMAIL = "alerts@gwenda.co.uk"
INVITE_BASE_URL = "https://gwenda.co.uk"
INVITE_IMAGE_URL = "https://gwenda.co.uk/images/event-invite.jpg"

[[env.preview.d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "e5ac0a26-2c6c-4182-9230-073ea8f331b1"

[[env.preview.d1_databases]]
binding = "CONFIG_DB"
database_name = "gwenda-config"
database_id = "af5ceb9e-edfb-40f1-a92c-54a7dbb3cd7b"

[[env.preview.d1_databases]]
binding = "OPS_DB"
database_name = "gwenda-ops"
database_id = "2b070281-670d-412b-9da3-da906325ea74"
