<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 844" width="956" height="844">
  <!--
    Where the drawing's black belongs to something (#320). The masters draw
    the black so they stand on a light page, but only the black that is part
    of an object: the bottle's glass, the record's surface, the slits and
    scratches in the letters and the pour. The air stays see-through: the bay
    between the pour and the bottle, the gaps between GWENDA's letters, the
    insides of the D and the A.

    scripts/trace-logo.mjs finds the slits and scratches itself (they are
    thin, and shut in by the ink). The two objects it cannot tell from air are
    drawn here, in the original's pixels; it reads the groups by their ids and
    takes only their shapes. Open this file in a browser or a drawing tool to
    see them over the original, and run `npm run brand:logo` after a change.
  -->
  <rect width="956" height="844" fill="#0b0a08"/>
  <image href="bottle-original.png" width="956" height="844"/>

  <!--
    solid: black all over, wherever there is no ink. The record's surface and
    the inside of the pour that lands on it. Its edge runs under the cream all
    the way round, so none of it shows beyond: up the middle of the melt on
    the left and the record's back rim, up the pour's upper stroke to the
    bottle's mouth, back down the middle of the right-hand stream (the bay
    beyond it is air), and round the record's front, where the pool or the
    letters' tops cover it and the gaps between the letters begin.
  -->
  <g id="solid" fill="#3fa7ff" fill-opacity="0.35">
    <path d="M30 455 L33 440 L44 430 L50 420 L58 410 L62 400 L80 384 L100 364.5 L120 352.5
      L140 342.5 L160 334 L180 326 L200 320 L220 314.5 L240 309.5 L260 305.5 L280 303
      L300 298 L320 289 L340 284 L360 270 L380 256 L400 226.5 L420 202 L440 183
      L453.5 220 L445 240 L440 262 L441 285 L446 302 L463 320 L483 340 L512 360
      L535 383 L575 412 L605 440 L630 465 L648 488
      A298.8 114 0 0 1 362 569 A332 114 0 0 1 30 455 Z"/>
  </g>

  <!--
    shut: black where the outline shuts it in. The bottle: its outline has
    breaks, so inside this shape a gap in the ink under 20px counts as shut
    and what lies behind it is glass. The shape is loose where the bottle
    meets open air (above it and to its right) and tight where it meets the
    bay: there it runs along the bottle's lower edge, the neck's underside and
    the mouth's lower lip, so the bay is never taken for glass.
  -->
  <g id="shut" fill="#ff5fd2" fill-opacity="0.3">
    <path d="M420 190 L418 150 L430 110 L450 80 L480 55 L515 45 L560 52 L600 65 L625 70
      L645 40 L668 5 L700 0 L770 30 L850 75 L910 115 L945 160 L956 200 L956 240
      L940 320 L915 400 L895 455 L860 478 L848 480 L834 479
      L820 472.5 L800 458.5 L780 446 L760 434 L740 424 L720 415 L700 406 L680 397
      L660 388.5 L640 381.5 L620 373 L600 364 L580 352 L562 340 L549 325 L546 308
      L538 292 L528 282 L510 275 L490 262 L470 250 L455 238 Z"/>
  </g>
</svg>
