      L331 553 L354.5 554.5 L355.2 556 L359.4 563.2 L363.6 556 L374.5 553.5 L377.2 552.5
      C377 557.5 379.5 560 383 560 C386.5 560 389 557.5 389 552.5
      L392 552.5 L392.5 555 L394.6 560.5 L397 555 L400 552.5 L456 552 L456 549.5 L472.5 548.5
      L475.5 553 L478.5 548 L479.5 548 L481.3 546.5
      C481.3 551 484.5 553.5 488.8 553.5 C493 553.5 496.4 551 496.4 546
      L499 546 L536.5 541.5 L540 546.5 L543 541 L546 538 L546.8 533
      C547 539 552.5 541.8 561 541.8 C569 541.8 579.6 541.5 583.3 534
      L585 534.5 L588.5 527.5 L592 532 L596 526.5 L610 521.5 L622 510.5 L634 501 L648 508 L656 511
      C655.6 521 652.8 529 652.5 538 C652.3 543.5 656.5 546.5 656.5 552 C656.5 557 653 560.5 648.5 560.5
      C644 560.5 640.5 557 640.5 552 C640.5 546.5 644.7 543.5 644.5 538 C644.3 529 635.2 516.1 628 519.6
      C620.8 523.1 613.7 526.7 606.5 530.6 C599.3 534.5 592.2 540 585 543.1 C577.8 546.2 570.7 546.7 563.5 549.2 C556.3 551.8 549.2 554.2 542 556.4
      C532.8 559.1 525.5 566.6 525.3 576 C525.2 580 528.3 577.8 528.3 584 C528.3 588.4 525.2 591.7 521 591.7 C516.8 591.7 513.7 588.4 513.7 584 C513.7 577.8 516.8 580 516.7 576 C516.5 570.3 509.2 562.8 500 564.2
      C492.7 565.3 485.4 566.3 478.1 567.3 C470.8 568.3 463.5 569.2 456.2 570 C448.9 570.8 441.6 573.6 434.3 574.6 C426.9 575.5 419.6 573.5 412.3 573.3 C405 573.1 397.7 573.7 390.4 573.8 C383.1 573.9 375.8 573.8 368.5 573.5
      C357.8 573.1 349.2 584.7 349.1 595 C349 600.8 352.4 600.6 352.4 606.5 C352.4 610.6 349.4 613.8 345.5 613.8 C341.6 613.8 338.6 610.6 338.6 606.5 C338.6 600.6 342 600.8 341.9 595 C341.8 583.7 333.2 572.1 322.5 571.4
