      L580 536.5 L596 530.5 L604 526 L620 515.5 L636 505 L648 520 L656 511
      C656.5 501 654 491.5 650.5 482 C646 470 636 458 630 450
      C627.6 446.8 629 441 636 438.5
      L700 446 L780 470 L836 491 L862 486 L900 468 L976 468 L976 864 L-20 864 Z"/>
  </g>

