      C90.5 617.5 87 620.5 82.8 620.5 C78.6 620.5 75 617.5 75 613 C75 608.5 75.2 604 75.6 601 Z"/>
    <!-- Two specks of the original's black that the stream's new edge would leave stranded: closed. -->
    <path d="M642 473 L647 474.8 L648.8 478.4 L650.3 482 L652.2 487.5 L644 489 Z"/>
    <circle cx="622.5" cy="501.5" r="3.6"/>
  </g>

  <!--
    solid: black all over, wherever there is no ink (see bottle-black.svg,
    whose record this adds to). The record's front, under the pool: the
    pockets between the streams reach a little below the record's own edge,
    and are record still. Its lower edge runs inside the pool, above its
    underside.
  -->
  <g id="solid" fill="#3fa7ff" fill-opacity="0.35">
    <path d="M186 535 L260 548 L362 553 L460 548 L540 532 L600 512 L600 530 L560 546 L520 557
      L480 563 L440 567 L400 569 L362 569.5 L320 567 L280 564 L240 562 L200 562 L186 563 Z"/>
  </g>
</svg>
