<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 844" width="956" height="844">
  <!--
    The front of the record in the bottle-and-record logo, drawn by hand over
    the original (#320). scripts/trace-logo.mjs reads the two groups below by
    their ids and takes only their shapes: the colours here are for looking at
    this file, which shows the result roughly as it will be traced (open it in
    a browser or a drawing tool). Units are the original's pixels. Run
    `npm run brand:logo` after changing a path.

    In the full logo the pour and the record's melting rim run down into
    GWENDA, and the record's front is hidden behind them. Here the record is
    whole: its front edge is a deep, round curve that carries on from the
    melt's outer edge on the left, sweeps under the record and comes up on the
    right under the end of the pour. The black is see-through, so the record's
    front is line work, like the rest of the drawing: a rim line, grooves, and
    the streams of the pour running down across it and over the edge.
  -->
  <rect width="956" height="844" fill="#0b0a08"/>
  <image href="bottle-original.png" width="956" height="844"/>

  <!--
    erase: what goes from the original. Everything under this line: GWENDA,
    and the streams from where the letters' tops begin (the line runs inside
    the ink below wherever it crosses cream, so no cut shows). On the left it
    keeps the melt down to the end of its hatching; between x 264 and 316 it
    steps up to take the top of the W. Its right-hand end is the new edge of
    the stream that ran on to the A: it leaves the stream's own edge at
    (630, 450), on its tangent, and turns down round the record's end.
  -->
