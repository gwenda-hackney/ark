<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 844" width="956" height="844">
  <!--
    The front of the record in the bottle-and-record logo, drawn by hand over
    the original (#320). scripts/trace-logo.mjs reads the groups below by
    their ids and takes only their shapes: the colours here are for looking at
    this file, which shows the result roughly as it will be traced (open it in
    a browser or a drawing tool). Units are the original's pixels. Run
    `npm run brand:logo` after changing a path.

    In the full logo the pour and the record's melting rim run down into
    GWENDA. Here they end at the record: the streams reach its front rim and
    pool along it, the black gaps between them end in round pockets just above
    the rim, and the pool drips over the edge. Nothing ends in a cut.
  -->
  <rect width="956" height="844" fill="#0b0a08"/>
  <image href="bottle-original.png" width="956" height="844"/>

  <!--
    erase: what goes from the original. Everything under this line: GWENDA,
    and the streams from just inside the pool on down (the line runs inside the
    ink below wherever it crosses cream, so no cut shows). It steps up between
    x 264 and 316 to take the top of the W. Its right-hand end is the new edge
    of the stream that ran on to the A: it leaves the stream's own edge at
    (630, 450), on its tangent, and turns down round the record's end.
  -->
  <g id="erase" fill="#0b0a08">
    <path d="M-20 604 L85 604 L85 593 L93 588.5 L103 580 L120 574 L150 571 L185 565
      L200 560 L216 559 L240 560.5 L262 563
      L264 563 L266 540 Q268 529 280 528 L302 528 Q314 529 315 540 L316 566.5
      L320 567.9 L362 569 L400 568 L440 565 L480 560 L520 552.5 L560 543
      L580 536.5 L596 530.5 L604 526 L620 515.5 L636 505 L648 520 L656 511
      C656.5 501 654 491.5 650.5 482 C646 470 636 458 630 450
      C627.6 446.8 629 441 636 438.5
      L700 446 L780 470 L836 491 L862 486 L900 468 L976 468 L976 864 L-20 864 Z"/>
  </g>

  <!--
    ink: the cream drawn in. The first shape is the pool. Along its top, left
    to right: the pockets that end the black gaps between the streams, the
    rim's own line where no stream crosses it (x 272 to 310), and small
    notches that bring the original's hatch lines to a point instead of a cut.
    Along its bottom, right to left: the pour's end running into a drip, the
    pool's underside with a drip under the N's stream and one under the
    two-pronged stream, a bead forming under the next, and the melt's outer
    edge running into the last drip.
  -->
  <g id="ink" fill="#e6d9be">
    <path d="M75.6 601 L77.5 595 L80 601.5 L83 595.5 L83.2 591.5 L91.7 586.5 L101.5 577.8 L119.5 571.7 L150 568.6 L184 562.2
