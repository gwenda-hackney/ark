# Dev ops (gwenda-ops-dev): the hosted dev environment. Same app as prod ops,
# on the dev copies: Gwenda Dev Sanity, the dev Ops DB, dev config rows and the
# __LOCAL secrets. SITE_ENV=dev (a developer's machine is SITE_ENV=local). Its website is
# gwenda-web-dev; it can never touch gwenda.co.uk. Deployed from main by
# apps.yml, which copies this file over wrangler.toml.
name = "gwenda-ops-dev"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
# Form emails (shared/gmail-send.js) build the message with nodemailer.
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_ENV = "dev"
SANITY_PROJECT_ID = "gwscpagy"
GOOGLE_OAUTH_CLIENT_ID = "682046070260-n9jpt18kt29vufljre5dkfqupq7rrdlt.apps.googleusercontent.com"
SITE_DEPLOY_WEBHOOK_URL = "https://gwenda-site-deploy-webhook.dscalamogna.workers.dev"
SANITY_STUDIO_SITE_DEPLOY_URL = "https://gwenda-site-deploy-webhook.dscalamogna.workers.dev"
# Form emails resent from /forms: the same mailbox and alerts as the website.
ALERT_EMAIL = "alerts@gwenda.co.uk"
# Instagram (#26): dev ops posts to the fake Instagram Worker, never to Meta.
# Unset is a dry run. Set it once the fake is deployed (docs/instagram.md):
# INSTAGRAM_GRAPH_URL = "https://gwenda-instagram-fake.<dev subdomain>.workers.dev/v24.0"

[ai]
binding = "AI"
remote = true

# D1 databases (#127, db/README.md): this account's own; ids from shared/d1-databases.js.
# Unused until each feature moves. Never `remote = true` here: ops:dev runs this file
# locally, so it gets a throwaway local database, never production's.
[[d1_databases]]
binding = "OPS_DB"
database_name = "gwenda-ops"
database_id = "d3d5053d-45b7-48ba-b2f4-af5af109fbb3"

[[d1_databases]]
binding = "WEBSITE_DB"
database_name = "gwenda-website"
database_id = "868113b6-d7bd-4e34-8ee9-5bf5438c50a1"

[[d1_databases]]
binding = "CONFIG_DB"
database_name = "gwenda-config"
database_id = "9123334a-25d7-4238-b478-dd5bd2499658"
