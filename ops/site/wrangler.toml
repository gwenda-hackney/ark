name = "gwenda-ops"
pages_build_output_dir = "src"
compatibility_date = "2026-07-01"

# Table ids are resolved at runtime by name from the Baserow catalog.
# Optional BASEROW_OPS_DATABASE_ID scopes when the token can see more than one Ops-like DB.
# BASEROW_API_KEY stays a Pages secret. Non-secret knobs live in Baserow App Config.
[vars]
SITE_ENV = "production"
SANITY_PROJECT_ID = "pn5yjro6"
BASEROW_OPS_DATABASE_ID = "556507"

[ai]
binding = "AI"
remote = true
