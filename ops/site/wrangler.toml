BASEROW_OPS_DATABASE_ID = "556507"
BASEROW_OPS_SECTIONS_TABLE_ID = "1196325"
BASEROW_OPS_ITEMS_TABLE_ID = "1196326"
BASEROW_OPS_INGREDIENTS_TABLE_ID = "1196327"
BASEROW_OPS_INVENTORY_TABLE_ID = "1199467"
BASEROW_OPS_SUPPLIERS_TABLE_ID = "1201355"
BASEROW_OPS_INVENTORY_SUPPLIERS_TABLE_ID = "1201356"
BASEROW_OPS_USERS_TABLE_ID = "1202467"

[ai]
binding = "AI"
remote = true
