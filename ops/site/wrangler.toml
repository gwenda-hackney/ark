name = "gwenda-ops"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
# Form emails (shared/gmail-send.js) build the message with nodemailer.
compatibility_flags = ["nodejs_compat"]

# The Baserow token (BASEROW_API_KEY, a Pages secret) picks the workspace: the
# production token sees Gwenda. Database and table ids are resolved by table
# names at runtime; none are configured.
# Non-secret knobs live in the Baserow config database (docs/config.md).
[vars]
SITE_ENV = "production"
SANITY_PROJECT_ID = "pn5yjro6"
# Non-secret OAuth client id (secret stays a Pages secret). Needed so direct
# `wrangler pages deploy` snapshots include it — project API plain_text vars alone are not enough.
GOOGLE_OAUTH_CLIENT_ID = "682046070260-n9jpt18kt29vufljre5dkfqupq7rrdlt.apps.googleusercontent.com"
SITE_DEPLOY_WEBHOOK_URL = "https://gwenda-site-deploy-webhook.dscalamogna.workers.dev"
SANITY_STUDIO_SITE_DEPLOY_URL = "https://gwenda-site-deploy-webhook.dscalamogna.workers.dev"
# Form emails resent from /forms: the same mailbox and alerts as the website.
ALERT_EMAIL = "alerts@gwenda.co.uk"
SITE_HEALTH_URL = "https://health.gwenda.co.uk"
# Secondary calendar shared with gwenda-ops-drive. Local ops sets SITE_ENV=local and ignores this.
GOOGLE_CALENDAR_ID = "c_5f8cc21d86540230e430cc5d0fdb58cda525cfbf673d84b1f0bf596d401c8594@group.calendar.google.com"

[ai]
binding = "AI"
remote = true
