<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Enter · Gwenda ops</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d0d; --ink:#f7f3eb; --muted:#9a958c; --gold:#c9a84c; --line:#2a2a28;
  --font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:var(--font);background:var(--bg);color:var(--ink);padding:1.5rem;
}
main{width:min(100%,22rem);text-align:center}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .5rem}
h1{font-size:1.45rem;font-weight:600;margin:0 0 .4rem}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 1.35rem}
form{display:flex;flex-direction:column;gap:.65rem}
input{
  width:100%;padding:.7rem .85rem;border:1px solid var(--line);background:#161614;
  color:var(--ink);font:inherit;font-size:.95rem
}
input:focus{outline:1px solid var(--gold);border-color:var(--gold)}
button{
  appearance:none;border:1px solid var(--gold);background:var(--gold);color:#0d0d0d;
  font:inherit;font-weight:600;padding:.7rem 1rem;cursor:pointer
}
button:hover{filter:brightness(1.05)}
.error{color:#e8a0a0;font-size:.82rem;margin:0;min-height:1.2em}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Gwenda · internal</p>
  <h1>Enter our world</h1>
  <p class="lead">Internal ops tools — enter to continue.</p>
  <form id="gate-form" novalidate>
    <label for="gate-password" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Password</label>
    <input type="password" id="gate-password" name="password" autocomplete="current-password" placeholder="Password" required>
    <button type="submit">Enter</button>
    <p class="error" id="gate-error" hidden></p>
  </form>
</main>
<script>
(function () {
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-password");
  const error = document.getElementById("gate-error");
  const next = new URLSearchParams(location.search).get("next") || "/";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;
    try {
      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: input.value, next }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        error.textContent = data.error || "That password isn't right.";
        error.hidden = false;
        return;
      }
      location.assign(data.redirect || "/");
    } catch {
      error.textContent = "Could not reach the gate. Try again.";
      error.hidden = false;
    }
  });
})();
</script>
</body>
</html>
