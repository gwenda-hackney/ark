<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gwenda Operations</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f4f2; --paper:#fff; --ink:#0d0d0d; --muted:#6b6964;
  --gold:#c9a84c; --gold-dark:#8b6914; --line:color-mix(in srgb, var(--gold) 28%, #d0d0cc);
  --font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:#23211b;line-height:1.5}
main{max-width:36rem;margin:0 auto;padding:2.5rem 1.25rem 3rem}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);margin:0 0 .35rem}
h1{font-size:clamp(1.5rem,3vw,1.85rem);font-weight:600;margin:0;color:var(--ink)}
h1::after{content:"";display:block;width:3.5rem;height:1px;margin-top:.7rem;background:linear-gradient(90deg,var(--gold),transparent)}
.sub{color:var(--muted);font-size:.92rem;margin:.75rem 0 1.75rem;max-width:40ch}
ul{list-style:none;margin:0;padding:0}
li{margin:0 0 .55rem}
a{
  display:block;padding:.95rem 1.05rem;background:var(--paper);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem
}
a:hover{border-color:var(--gold)}
a span{display:block;font-weight:400;font-size:.82rem;color:var(--muted);margin-top:.2rem}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Gwenda · internal</p>
  <h1>Gwenda Operations</h1>
  <p class="sub">Working tools for opening stock, menu prices, and the rest.</p>
  <ul>
    <li>
      <a href="/stock/">Menu prices &amp; stock
        <span>Sell prices, POS names, Alivini fulfilment, still need</span>
      </a>
    </li>
    <li>
      <a href="/breakeven/">Breakeven analysis
        <span>Revenue, cost &amp; breakeven projections</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
