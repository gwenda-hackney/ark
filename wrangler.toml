# Cloudflare Pages — production project (gwenda).
# Vars sync on deploy via wrangler pages deploy (replaces ensure-pages-env.mjs).
# Secrets: scripts/ci/sync-pages-secrets.mjs (not stored in repo).
name = "gwenda"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
SITE_ENV = "production"

# Preview branch deploys (e.g. release-preview) use the same runtime as production.
[env.preview.vars]
SITE_ENV = "production"
