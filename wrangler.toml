name = "gwenda"
compatibility_date = "2024-01-01"

pages_build_output_dir = "dist"

# CI deploys Cloudflare Pages projects:
#   gwenda-staging — main branch, password gated (staging.gwenda.co.uk)
#   gwenda         — release branch, production (gwenda.co.uk + www)
# Custom domains stay on the production project; CI preview-then-production deploys.
