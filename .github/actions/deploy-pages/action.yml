name: Deploy to Cloudflare Pages
description: Build and deploy the static site to a Cloudflare Pages project

# Runtime Pages secrets are written by sync-pages-secrets.mjs from the job env
# (env:web:pull). secrets-profile picks production vs dev. A deploy-branch
# other than the project's production branch is its preview (wrangler
# [env.preview.vars]: drafts shown, password gate).

inputs:
  pages-project:
    description: Cloudflare Pages project name
    required: true
  pages-production-branch:
    description: Production branch for the Pages project
    required: true
  deploy-branch:
    description: Branch label passed to wrangler pages deploy
    required: true
  wrangler-config:
    description: Wrangler config file (vars for production/preview environments)
    required: false
    default: wrangler.toml
  skip-build:
    description: Deploy existing dist/ only (no npm run build)
    required: false
    default: "false"
  public-is-preview:
    description: Set PUBLIC_IS_PREVIEW=true for a preview or the dev website
    required: false
    default: "false"
  public-opening-date:
    description: PUBLIC_OPENING_DATE build variable
    required: false
    default: "2026-08-01"
  build-version:
    description: CalVer build version
    required: true
  build-sha:
    description: Git commit SHA
    required: true
  build-ref:
    description: Git ref name
    required: true
  build-time:
    description: Build timestamp
    required: true
  cloudflare-api-token:
    description: Cloudflare API token
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID
    required: true
  sanity-api-token:
    description: SANITY_API_TOKEN — CI token for build-time CMS fetch (from Bitwarden SM)
    required: false
  sanity-dataset:
    description: Sanity dataset for build-time CMS fetch (each project has one, production)
    required: false
    default: production
  sanity-perspective:
    description: published for a live site, previewDrafts for a preview (drafts over published)
    required: false
    default: published
  sanity-project-id:
    description: Sanity project (the real one, or gwscpagy for the dev website)
    required: false
    default: pn5yjro6
  env-label:
    description: Ribbon text for a non-live build (PUBLIC_ENV_LABEL). Empty = default.
    required: false
    default: ""
  site-origin:
    description: Public address of a non-live build (PUBLIC_SITE_ORIGIN). Empty = prod's preview.
    required: false
    default: ""
  snapshot-environment:
    description: prod or dev. Which environment's build snapshot to record.
    required: false
    default: prod
  baserow-ops-api-key:
    description: Ops Baserow token for the featured artist at build time
    required: false
    default: ""
  baserow-ops-database-id:
    description: Ops Baserow database id for the featured artist at build time
    required: false
    default: ""
  snapshot-site:
    description: >
      preview or production to record what this build was made
      from (ops shows changes made since as "waiting for the website"). Empty
      for branch previews.
    required: false
    default: ""
  secrets-profile:
    description: production or dev. Passed to sync-pages-secrets.mjs.
    required: true

outputs:
  deployment-url:
    description: Cloudflare Pages deployment URL
    value: ${{ steps.pages_deploy.outputs.deployment-url }}
  pages-deployment-alias-url:
    description: Cloudflare Pages branch alias URL (preview branches)
    value: ${{ steps.pages_deploy.outputs.pages-deployment-alias-url }}

runs:
  using: composite
  steps:
    - name: Capture content snapshot
      if: inputs.snapshot-site != '' && inputs.skip-build != 'true'
      shell: bash
      run: node scripts/site-build-snapshot.mjs capture --out "$RUNNER_TEMP/site-snapshot.json"
      env:
        SANITY_PROJECT_ID: ${{ inputs.sanity-project-id }}
        SANITY_DATASET: ${{ inputs.sanity-dataset }}
        SANITY_PERSPECTIVE: ${{ inputs.sanity-perspective }}
        SANITY_API_TOKEN: ${{ inputs.sanity-api-token }}
        BASEROW_OPS_API_KEY: ${{ inputs.baserow-ops-api-key }}
        BASEROW_OPS_DATABASE_ID: ${{ inputs.baserow-ops-database-id }}
        BUILD_SHA: ${{ inputs.build-sha }}

    - name: Build
      if: inputs.skip-build != 'true'
      shell: bash
      run: cd marketing/web && npm run build
      env:
        PUBLIC_IS_PREVIEW: ${{ inputs.public-is-preview }}
        PUBLIC_BUILD_SHA: ${{ inputs.build-sha }}
        PUBLIC_BUILD_REF: ${{ inputs.build-ref }}
        PUBLIC_BUILD_TIME: ${{ inputs.build-time }}
        PUBLIC_BUILD_VERSION: ${{ inputs.build-version }}
        PUBLIC_OPENING_DATE: ${{ inputs.public-opening-date }}
        PUBLIC_ENV_LABEL: ${{ inputs.env-label }}
        PUBLIC_SITE_ORIGIN: ${{ inputs.site-origin }}
        SANITY_PROJECT_ID: ${{ inputs.sanity-project-id }}
        SANITY_DATASET: ${{ inputs.sanity-dataset }}
        SANITY_PERSPECTIVE: ${{ inputs.sanity-perspective }}
        SANITY_API_TOKEN: ${{ inputs.sanity-api-token }}
        BASEROW_OPS_API_KEY: ${{ inputs.baserow-ops-api-key }}
        BASEROW_OPS_DATABASE_ID: ${{ inputs.baserow-ops-database-id }}

    # What verify.yml used to check on its own separate build.
    - name: Check build output
      if: inputs.skip-build != 'true'
      shell: bash
      run: |
        (cd marketing/web && node scripts/ci/verify-sanity-build.mjs)
        if rg -q 'cloudflareinsights\.com' marketing/web/dist/; then
          echo "marketing/web/dist/ contains manual Cloudflare Web Analytics embed — remove it from source" >&2
          exit 1
        fi

    - name: Ensure dist exists
      if: inputs.skip-build == 'true'
      shell: bash
      run: |
        if [ ! -d marketing/web/dist ] || [ -z "$(ls -A marketing/web/dist 2>/dev/null)" ]; then
          echo "skip-build requires a non-empty marketing/web/dist/ directory" >&2
          exit 1
        fi

    - name: Refresh build headers
      if: inputs.skip-build == 'true'
      shell: bash
      run: cd marketing/web && node scripts/write-build-headers.mjs
      env:
        PUBLIC_BUILD_SHA: ${{ inputs.build-sha }}
        PUBLIC_BUILD_TIME: ${{ inputs.build-time }}
        PUBLIC_BUILD_VERSION: ${{ inputs.build-version }}

    - name: Ensure Pages project exists
      shell: bash
      run: cd marketing/web && node scripts/ensure-pages-project.mjs
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PAGES_PROJECT_NAME: ${{ inputs.pages-project }}
        PAGES_PRODUCTION_BRANCH: ${{ inputs.pages-production-branch }}

    - name: Prepare Wrangler config
      shell: bash
      run: |
        if [ "${{ inputs.wrangler-config }}" != wrangler.toml ]; then
          cp "marketing/web/${{ inputs.wrangler-config }}" marketing/web/wrangler.toml
        fi

    - name: Sync Pages secrets from Bitwarden
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PAGES_PROJECT_NAME: ${{ inputs.pages-project }}
      run: node marketing/web/scripts/ci/sync-pages-secrets.mjs --project "${{ inputs.pages-project }}" --profile "${{ inputs.secrets-profile }}"

    - name: Deploy to Cloudflare Pages
      id: pages_deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy dist --project-name=${{ inputs.pages-project }} --commit-hash=${{ inputs.build-sha }} --branch=${{ inputs.deploy-branch }}
        workingDirectory: marketing/web

    - name: Save content snapshot
      if: inputs.snapshot-site != '' && inputs.skip-build != 'true'
      shell: bash
      run: node scripts/site-build-snapshot.mjs save --in "$RUNNER_TEMP/site-snapshot.json" --site "${{ inputs.snapshot-site }}" --environment "${{ inputs.snapshot-environment }}"
