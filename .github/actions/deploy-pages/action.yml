name: Deploy to Cloudflare Pages
description: Build and deploy the static site to a Cloudflare Pages project

inputs:
  pages-project:
    description: Cloudflare Pages project name
    required: true
  pages-production-branch:
    description: Production branch for the Pages project
    required: true
  secret-profile:
    description: Secret profile (staging or production)
    required: true
  deploy-branch:
    description: Branch label passed to wrangler pages deploy
    required: true
  wrangler-config:
    description: Wrangler config file (vars for production/preview environments)
    required: false
    default: wrangler.toml
  skip-build:
    description: Deploy existing dist/ only (no npm run build)
    required: false
    default: "false"
  public-is-staging:
    description: Set PUBLIC_IS_STAGING=true for staging builds
    required: false
    default: "false"
  public-opening-date:
    description: PUBLIC_OPENING_DATE build variable
    required: false
    default: "2026-08-01"
  public-booking-enabled-from:
    description: PUBLIC_BOOKING_ENABLED_FROM — booking CTA go-live date (YYYY-MM-DD, empty = off)
    required: false
    default: ""
  build-version:
    description: CalVer build version
    required: true
  build-sha:
    description: Git commit SHA
    required: true
  build-ref:
    description: Git ref name
    required: true
  build-time:
    description: Build timestamp
    required: true
  cloudflare-api-token:
    description: Cloudflare API token
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID
    required: true
  site-password:
    description: Staging site password secret
    required: false
  gate-bypass-key:
    description: Staging gate bypass key
    required: false
  baserow-api-key:
    description: Baserow API key
    required: false
  baserow-table-id:
    description: Baserow table ID
    required: false
  subscribe-secret:
    description: Subscribe endpoint secret
    required: false
  event-admin-secret:
    description: Bearer secret for /api/event-admin (Studio Event invites)
    required: false
  smtp-host:
    description: SMTP host for invite emails
    required: false
  smtp-port:
    description: SMTP port for invite emails
    required: false
  smtp-user:
    description: SMTP user for invite emails
    required: false
  smtp-password:
    description: SMTP password for invite emails
    required: false
  smtp-from:
    description: SMTP from address for invite emails
    required: false
  instagram-access-token:
    description: Instagram Graph API token for invite DMs
    required: false
  instagram-business-account-id:
    description: Instagram business account id for invite DMs
    required: false
  invite-base-url:
    description: Base URL for personal invite links
    required: false
  invite-image-url:
    description: Hero image URL in invite emails
    required: false
  invite-email-subject:
    description: Invite email subject template
    required: false
  invite-email-body:
    description: Invite email body template
    required: false
  invite-instagram-message:
    description: Invite Instagram DM template
    required: false
  sanity-api-token:
    description: SANITY_API_TOKEN — CI token for build-time CMS fetch
    required: false
  sanity-dataset:
    description: Sanity dataset for build-time CMS fetch (development or production)
    required: true

outputs:
  deployment-url:
    description: Cloudflare Pages deployment URL
    value: ${{ steps.pages_deploy.outputs.deployment-url }}
  pages-deployment-alias-url:
    description: Cloudflare Pages branch alias URL (preview branches)
    value: ${{ steps.pages_deploy.outputs.pages-deployment-alias-url }}

runs:
  using: composite
  steps:
    - name: Build
      if: inputs.skip-build != 'true'
      shell: bash
      run: cd web && npm run build
      env:
        PUBLIC_IS_STAGING: ${{ inputs.public-is-staging }}
        PUBLIC_BUILD_SHA: ${{ inputs.build-sha }}
        PUBLIC_BUILD_REF: ${{ inputs.build-ref }}
        PUBLIC_BUILD_TIME: ${{ inputs.build-time }}
        PUBLIC_BUILD_VERSION: ${{ inputs.build-version }}
        PUBLIC_OPENING_DATE: ${{ inputs.public-opening-date }}
        PUBLIC_BOOKING_ENABLED_FROM: ${{ inputs.public-booking-enabled-from }}
        SANITY_PROJECT_ID: pn5yjro6
        SANITY_DATASET: ${{ inputs.sanity-dataset }}
        SANITY_API_TOKEN: ${{ inputs.sanity-api-token }}

    - name: Ensure dist exists
      if: inputs.skip-build == 'true'
      shell: bash
      run: |
        if [ ! -d web/dist ] || [ -z "$(ls -A web/dist 2>/dev/null)" ]; then
          echo "skip-build requires a non-empty web/dist/ directory" >&2
          exit 1
        fi

    - name: Refresh build headers
      if: inputs.skip-build == 'true'
      shell: bash
      run: cd web && node scripts/write-build-headers.mjs
      env:
        PUBLIC_BUILD_SHA: ${{ inputs.build-sha }}
        PUBLIC_BUILD_TIME: ${{ inputs.build-time }}
        PUBLIC_BUILD_VERSION: ${{ inputs.build-version }}

    - name: Ensure Pages project exists
      shell: bash
      run: cd web && node scripts/ensure-pages-project.mjs
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PAGES_PROJECT_NAME: ${{ inputs.pages-project }}
        PAGES_PRODUCTION_BRANCH: ${{ inputs.pages-production-branch }}

    - name: Sync Pages secrets
      shell: bash
      run: cd web && node scripts/ci/sync-pages-secrets.mjs --project "${{ inputs.pages-project }}" --profile "${{ inputs.secret-profile }}"
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        SITE_PASSWORD: ${{ inputs.site-password }}
        GATE_BYPASS_KEY: ${{ inputs.gate-bypass-key }}
        BASEROW_API_KEY: ${{ inputs.baserow-api-key }}
        BASEROW_TABLE_ID: ${{ inputs.baserow-table-id }}
        SUBSCRIBE_SECRET: ${{ inputs.subscribe-secret }}
        EVENT_ADMIN_SECRET: ${{ inputs.event-admin-secret }}
        SMTP_HOST: ${{ inputs.smtp-host }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USER: ${{ inputs.smtp-user }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
        SMTP_FROM: ${{ inputs.smtp-from }}
        INSTAGRAM_ACCESS_TOKEN: ${{ inputs.instagram-access-token }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ inputs.instagram-business-account-id }}
        INVITE_BASE_URL: ${{ inputs.invite-base-url }}
        INVITE_IMAGE_URL: ${{ inputs.invite-image-url }}
        INVITE_EMAIL_SUBJECT: ${{ inputs.invite-email-subject }}
        INVITE_EMAIL_BODY: ${{ inputs.invite-email-body }}
        INVITE_INSTAGRAM_MESSAGE: ${{ inputs.invite-instagram-message }}

    - name: Prepare Wrangler config
      shell: bash
      run: |
        if [ "${{ inputs.wrangler-config }}" != wrangler.toml ]; then
          cp "web/${{ inputs.wrangler-config }}" web/wrangler.toml
        fi

    - name: Deploy to Cloudflare Pages
      id: pages_deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy dist --project-name=${{ inputs.pages-project }} --commit-hash=${{ inputs.build-sha }} --branch=${{ inputs.deploy-branch }}
        workingDirectory: web
