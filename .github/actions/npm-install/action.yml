name: Install npm dependencies (cached)
description: >
  Restores every workspace's node_modules from cache when package-lock.json is
  unchanged, and only runs npm ci on a miss. A full npm ci of the monorepo
  takes ~25s; a restore takes a few seconds.

runs:
  using: composite
  steps:
    - name: Restore node_modules
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          */*/node_modules
          */*/*/node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - name: npm ci
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
