name: Apps

on:
  push:
    paths:
      - "marketing/brand/**"
      - "marketing/web/src/config/colors.json"
      - "ops/site/**"
      - "shared/**"
      - "ops/README.md"
      - ".github/workflows/apps.yml"
      - ".github/scripts/sync-brand-tokens.mjs"
      - ".github/scripts/cloudflare-pages-branch.mjs"
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - brand
          - ops
      deploy_target:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - dev
          - production

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      brand: ${{ steps.set.outputs.brand }}
      ops: ${{ steps.set.outputs.ops }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            brand:
              - 'marketing/brand/**'
              - 'marketing/web/src/config/colors.json'
              - '.github/scripts/sync-brand-tokens.mjs'
              - '.github/workflows/apps.yml'
            ops:
              - 'ops/site/**'
              - 'shared/**'
              - 'ops/README.md'
              - '.github/workflows/apps.yml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            A="${{ inputs.app }}"
            brand=false
            ops=false
            if [ "$A" = "all" ] || [ "$A" = "brand" ]; then brand=true; fi
            if [ "$A" = "all" ] || [ "$A" = "ops" ]; then ops=true; fi
            echo "brand=$brand" >> "$GITHUB_OUTPUT"
            echo "ops=$ops" >> "$GITHUB_OUTPUT"
          else
            echo "brand=${{ steps.filter.outputs.brand }}" >> "$GITHUB_OUTPUT"
            echo "ops=${{ steps.filter.outputs.ops }}" >> "$GITHUB_OUTPUT"
          fi

  refuse-production-from-other-branches:
    name: Refuse production off release
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.deploy_target == 'production'
      && github.ref_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: |
          echo "Brand and ops production deploys only run from the release branch (got ${{ github.ref_name }})." >&2
          exit 1

  brand-production:
    name: Deploy brand (production)
    needs: changes
    if: >-
      needs.changes.outputs.brand == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.deploy_target == 'production'
      && github.ref_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: brand-production
      url: https://brand.gwenda.co.uk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Sync brand colour tokens
        run: npm run sync:brand

      - name: Verify brand tokens committed
        run: npm run sync:brand -- --check

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src --project-name gwenda-brand --branch main --commit-dirty=true
          workingDirectory: marketing/brand

      - name: Smoke test production
        run: |
          url="https://gwenda-brand.pages.dev/"
          for i in $(seq 1 12); do
            if curl -fsS "$url" | grep -q "Gwenda — Brand Guidelines"; then
              echo "OK $url"
              exit 0
            fi
            echo "Waiting for deployment… ($i/12)"
            sleep 5
          done
          echo "Brand guidelines not served at $url"
          exit 1

      - name: Deployment summary
        run: node marketing/web/scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Brand guidelines — production","rows":[
              ["Live","[brand.gwenda.co.uk](https://brand.gwenda.co.uk)"],
              ["Branch","`main`"],
              ["Git","`${{ github.ref_name }}` @ `${{ github.sha }}`"]
            ]}

  brand-preview:
    name: Deploy brand (preview)
    needs: changes
    if: >-
      needs.changes.outputs.brand == 'true' && (
      (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'release')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: brand-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Resolve Pages preview branch
        id: branch
        run: |
          NAME=$(node .github/scripts/cloudflare-pages-branch.mjs '${{ github.ref_name }}')
          if [ "$NAME" = "main" ] || [ "$NAME" = "release" ]; then
            NAME="preview-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Sync brand colour tokens
        run: npm run sync:brand

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src --project-name gwenda-brand --branch ${{ steps.branch.outputs.name }} --commit-dirty=true
          workingDirectory: marketing/brand

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ steps.branch.outputs.name }}.gwenda-brand.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        run: |
          url="${{ steps.preview_url.outputs.url }}"
          for i in $(seq 1 12); do
            if curl -fsS "$url" | grep -q "Gwenda — Brand Guidelines"; then
              echo "OK $url"
              exit 0
            fi
            echo "Waiting for preview… ($i/12)"
            sleep 5
          done
          echo "Brand guidelines preview not served at $url"
          exit 1

      - name: Deployment summary
        run: node marketing/web/scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Brand guidelines — branch preview","rows":[
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Pages branch","`${{ steps.branch.outputs.name }}`"],
              ["Git branch","`${{ github.ref_name }}`"],
              ["Commit","[\\`${{ github.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"],
              ["Production","Unchanged — run Apps from `release` with target production to update [brand.gwenda.co.uk](https://brand.gwenda.co.uk)"]
            ]}

  ops-production:
    name: Deploy ops (production)
    needs: changes
    if: >-
      needs.changes.outputs.ops == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.deploy_target == 'production'
      && github.ref_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ops-production
      url: https://gwenda-ops.pages.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Unit tests
        run: npm test -w @gwenda/ops && npm run test:shared

      - name: Build ops app
        run: npm run build -w @gwenda/ops

      # Baserow schema changes need a user login (database tokens only touch rows).
      - name: Baserow login for migrations
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      # Pages keeps each deployment's secrets, so the new code's secrets go on
      # before it deploys. Adds and updates only; the running ops keeps its own.
      - name: Sync ops secrets (SM env=production)
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/setup-ops-secrets.mjs

      # Additive only, so the ops still running keeps working (scripts/lib/migrations.mjs).
      - name: Migrations before deploy
        run: node scripts/migrate.mjs --app ops --phase pre --env production

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gwenda-ops --branch main --commit-dirty=true
          workingDirectory: ops/site

      - name: Smoke test production auth gate
        run: node scripts/smoke-ops-auth.mjs https://gwenda-ops.pages.dev/

      # Only now that the new ops is live: remove what the old code read, e.g.
      # retired config rows (migrations/config-retired-settings.mjs).
      - name: Pull ops config token from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ops:pull -- --github-env --profile production

      - name: Migrations after deploy
        run: node scripts/migrate.mjs --app ops --phase post --env production

      - name: Deployment summary
        run: node marketing/web/scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Ops tools — production","rows":[
              ["Live","[gwenda-ops.pages.dev](https://gwenda-ops.pages.dev)"],
              ["Branch","`main`"],
              ["Git","`${{ github.ref_name }}` @ `${{ github.sha }}`"]
            ]}

  # Dev ops (gwenda-ops-dev): the same app on the dev copies, from main. Its
  # website is gwenda-web-dev (web.yml). Secrets are the dev ones (NAME__DEV).
  ops-dev:
    name: Deploy ops (dev)
    needs: changes
    if: >-
      needs.changes.outputs.ops == 'true' && (
      (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'dev')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: ops-dev
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: ops-dev
      url: https://gwenda-ops-dev.pages.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Unit tests
        run: npm test -w @gwenda/ops && npm run test:shared

      - name: Build ops app
        run: npm run build -w @gwenda/ops

      - name: Ensure Pages project exists
        run: cd marketing/web && node scripts/ensure-pages-project.mjs
        env:
          PAGES_PROJECT_NAME: gwenda-ops-dev
          PAGES_PRODUCTION_BRANCH: main

      - name: Use the dev Wrangler config
        run: cp ops/site/wrangler.dev.toml ops/site/wrangler.toml

      - name: Sync dev ops secrets (SM env=dev)
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/setup-ops-secrets.mjs --project gwenda-ops-dev --env dev

      # Baserow schema changes need a user login (database tokens only touch rows).
      - name: Baserow login for migrations
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      # Additive only, so the ops still running keeps working (scripts/lib/migrations.mjs).
      - name: Migrations before deploy
        run: node scripts/migrate.mjs --app ops --phase pre --env dev

      - name: Deploy to Cloudflare Pages (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gwenda-ops-dev --branch main --commit-dirty=true
          workingDirectory: ops/site

      - name: Smoke test dev auth gate
        run: node scripts/smoke-ops-auth.mjs https://gwenda-ops-dev.pages.dev/

      # The new code is live: remove what only the old code used.
      - name: Migrations after deploy
        run: node scripts/migrate.mjs --app ops --phase post --env dev

  # Branch previews of ops run on gwenda-ops-dev (dev secrets, dev data), never
  # on gwenda-ops: a branch is unreviewed code. They share the dev databases and
  # run no migrations. The dev deploy from main puts the dev secrets on
  # gwenda-ops-dev's preview environment.
  ops-preview:
    name: Deploy ops (preview)
    needs: changes
    if: >-
      needs.changes.outputs.ops == 'true' && (
      (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'release')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ops-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Build ops app
        run: npm run build -w @gwenda/ops

      - name: Resolve Pages preview branch
        id: branch
        run: |
          NAME=$(node .github/scripts/cloudflare-pages-branch.mjs '${{ github.ref_name }}')
          if [ "$NAME" = "main" ] || [ "$NAME" = "release" ]; then
            NAME="preview-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Use the dev Wrangler config
        run: cp ops/site/wrangler.dev.toml ops/site/wrangler.toml

      - name: Deploy preview to Cloudflare Pages (dev)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gwenda-ops-dev --branch ${{ steps.branch.outputs.name }} --commit-dirty=true
          workingDirectory: ops/site

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ steps.branch.outputs.name }}.gwenda-ops-dev.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview auth gate
        run: node scripts/smoke-ops-auth.mjs "${{ steps.preview_url.outputs.url }}" --retries 12 --retry-delay-ms 5000

      - name: Deployment summary
        run: node marketing/web/scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Ops tools — branch preview (dev data)","rows":[
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Data","Dev copies (Gwenda Dev Sanity, dev Baserow). No migrations run for previews."],
              ["Pages branch","`${{ steps.branch.outputs.name }}`"],
              ["Git branch","`${{ github.ref_name }}`"],
              ["Commit","[\\`${{ github.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"],
              ["Production","Unchanged — run Apps from `release` with target production to update [gwenda-ops.pages.dev](https://gwenda-ops.pages.dev)"]
            ]}
