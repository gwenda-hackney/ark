name: Deploy site deploy webhook

on:
  push:
    branches:
      - main
    paths:
      - "utils/site-deploy-webhook/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site-deploy-webhook.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @gwenda/site-deploy-webhook

      - name: Unit tests
        run: npm test -w @gwenda/site-deploy-webhook

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: utils/site-deploy-webhook

      - name: Sync Worker secrets
        run: |
          cd utils/site-deploy-webhook
          echo "$DEPLOY_WEBHOOK_SECRET" | npx wrangler secret put DEPLOY_WEBHOOK_SECRET
          echo "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
