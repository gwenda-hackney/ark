name: Deploy production

on:
  push:
    branches:
      - release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    uses: ./.github/workflows/deploy-environment.yml
    with:
      pages-project: gwenda
      pages-production-branch: release
      site-env: production
      secret-profile: production
      public-is-staging: "false"
      public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
      smoke-test-urls: |
        https://gwenda.co.uk
        https://www.gwenda.co.uk
      summary-title: Production deployed
      summary-site-url: https://gwenda.co.uk
      summary-pages-dev-url: https://gwenda-blue.pages.dev
      github-environment: production
      github-environment-url: https://gwenda.co.uk
      public-cf-beacon-token: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
      tag-release: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
      SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
