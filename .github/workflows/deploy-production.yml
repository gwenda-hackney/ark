name: Deploy production

on:
  push:
    branches:
      - release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      deployments: write
    environment:
      name: production
      url: https://gwenda.co.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve production slot
        id: slot
        run: node scripts/ci/resolve-production-slot.mjs
        env:
          PRODUCTION_ACTIVE_SLOT: ${{ vars.PRODUCTION_ACTIVE_SLOT }}

      - name: Compute build metadata
        id: buildmeta
        run: node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Resolve Web Analytics beacon token
        id: beacon
        run: echo "token=$(node scripts/resolve-beacon-token.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Deploy standby slot
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: ${{ steps.slot.outputs.deploy_project }}
          pages-production-branch: release
          site-env: production
          secret-profile: production
          deploy-branch: release
          public-is-staging: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          beacon-token: ${{ steps.beacon.outputs.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}

      - name: Smoke test standby
        run: node scripts/ci/smoke-test.mjs --url "${{ steps.slot.outputs.deploy_url }}"

      - name: Swap production domain
        run: node scripts/ci/swap-production-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_PROJECT: ${{ steps.slot.outputs.live_project }}
          STANDBY_PROJECT: ${{ steps.slot.outputs.deploy_project }}
          NEW_ACTIVE_SLOT: ${{ steps.slot.outputs.standby_slot }}
          CUSTOM_DOMAIN: gwenda.co.uk
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Tag production release
        run: node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      - name: Deployment summary
        run: node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production deployed","rows":[
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Active slot","`${{ steps.slot.outputs.standby_slot }}`"],
              ["Standby tested","${{ steps.slot.outputs.deploy_url }}"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Site","https://gwenda.co.uk"],
              ["Rollback","Re-run swap to `${{ steps.slot.outputs.active_slot }}` slot (${{ steps.slot.outputs.live_project }})"],
              ["Deployments","[GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=production)"]
            ]}
