name: Deploy production

on:
  push:
    branches:
      - release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    environment:
      name: production
      url: https://gwenda.co.uk
    uses: ./.github/workflows/pages-preview-production.yml
    with:
      pages-project: gwenda
      pages-production-branch: release
      production-deploy-branch: release
      site-env: production
      secret-profile: production
      public-is-staging: "false"
      public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
      live-smoke-urls: |
        https://gwenda.co.uk
        https://www.gwenda.co.uk
      tag-release: true
      summary-title: Production deployed
      summary-site-url: https://gwenda.co.uk
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
      BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}
      SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
