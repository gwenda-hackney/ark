name: Deploy production

on:
  push:
    branches:
      - release
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/verify.yml"
      - ".github/actions/deploy-pages/**"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  deploy-preview:
    name: Deploy production preview
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-preview
      url: https://release-preview.gwenda-blue.pages.dev
    outputs:
      version: ${{ steps.buildmeta.outputs.version }}
      sha: ${{ steps.buildmeta.outputs.sha }}
      ref: ${{ steps.buildmeta.outputs.ref }}
      time: ${{ steps.buildmeta.outputs.time }}
      preview-url: ${{ steps.preview_url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: cd web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          secret-profile: production
          deploy-branch: release-preview
          wrangler-config: wrangler.toml
          public-is-staging: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          public-booking-enabled-from: ${{ vars.PUBLIC_BOOKING_ENABLED_FROM || '' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}
          sanity-api-token: ${{ secrets.SANITY_API_TOKEN }}

      - name: Upload preview dist for promote
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: web/dist/
          retention-days: 14

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            echo "Could not resolve Cloudflare Pages preview URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Allow AI crawlers on production zone
        run: cd web && node scripts/ensure-zone-ai-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_NAME: gwenda.co.uk

      - name: Smoke test preview
        run: cd web && node scripts/ci/smoke-test.mjs --url "${{ steps.preview_url.outputs.url }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      - name: Preview deployment summary
        run: cd web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production preview ready — review before promoting","rows":[
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Next step","Review the preview above, then run [Promote production to live](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production-promote.yml)"]
            ]}
