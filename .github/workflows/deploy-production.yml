name: Deploy production

on:
  push:
    branches:
      - release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      deployments: write
    environment:
      name: production
      url: https://gwenda.co.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          site-env: production
          secret-profile: production
          deploy-branch: ${{ github.ref_name }}
          public-is-staging: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}
          analytics-host: gwenda.co.uk
          analytics-zone: gwenda.co.uk

      - name: Ensure apex custom domain
        run: node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: gwenda.co.uk

      - name: Ensure www custom domain
        run: node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: www.gwenda.co.uk

      - name: Smoke test live domains
        run: |
          for url in https://gwenda.co.uk https://www.gwenda.co.uk; do
            node scripts/ci/smoke-test.mjs --url "$url" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000
          done

      - name: Tag production release
        run: node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      - name: Deployment summary
        run: node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production deployed","rows":[
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Site","https://gwenda.co.uk"],
              ["Pages dev","https://gwenda-blue.pages.dev"],
              ["Deployments","[GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=production)"]
            ]}
