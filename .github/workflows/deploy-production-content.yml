name: Deploy production content

# Studio "Deploy preview" — builds published production content to the
# release-preview slot. Promote to live is a separate workflow.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-deploy-production]

concurrency:
  group: deploy-production-content-preview
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      sanity-dataset: production

  deploy-preview:
    name: Deploy published content to preview
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-preview
      url: https://release-preview.gwenda-blue.pages.dev
    outputs:
      version: ${{ steps.buildmeta.outputs.version }}
      preview-url: ${{ steps.preview_url.outputs.url }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: cd web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: release
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.run_started_at }}

      - name: Deploy content preview
        id: deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          secret-profile: production
          deploy-branch: release-preview
          wrangler-config: wrangler.toml
          public-is-staging: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}
          event-admin-secret: ${{ secrets.EVENT_ADMIN_SECRET }}
          invite-base-url: https://gwenda.co.uk
          invite-image-url: https://gwenda.co.uk/images/event-invite.jpg
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          smtp-from: ${{ secrets.SMTP_FROM }}
          instagram-access-token: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          instagram-business-account-id: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          invite-email-subject: ${{ secrets.INVITE_EMAIL_SUBJECT }}
          invite-email-body: ${{ secrets.INVITE_EMAIL_BODY }}
          invite-instagram-message: ${{ secrets.INVITE_INSTAGRAM_MESSAGE }}
          sanity-api-token: ${{ secrets.SANITY_API_TOKEN }}
          sanity-dataset: production

      - name: Upload preview dist for promote
        uses: actions/upload-artifact@v4
        with:
          name: production-content-dist
          path: web/dist/
          retention-days: 14

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://release-preview.gwenda-blue.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write preview meta artifact
        run: |
          mkdir -p /tmp/content-preview-meta
          node -e "
            const fs = require('fs');
            fs.writeFileSync(
              '/tmp/content-preview-meta/meta.json',
              JSON.stringify({
                previewUrl: process.env.PREVIEW_URL,
                version: process.env.VERSION,
                runId: process.env.RUN_ID,
              }),
            );
          "
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
          VERSION: ${{ steps.buildmeta.outputs.version }}
          RUN_ID: ${{ github.run_id }}

      - name: Upload preview meta
        uses: actions/upload-artifact@v4
        with:
          name: content-preview-meta
          path: /tmp/content-preview-meta/
          retention-days: 14

      - name: Smoke test preview
        run: cd web && node scripts/ci/smoke-test.mjs --url "${{ steps.preview_url.outputs.url }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      - name: Preview deployment summary
        run: cd web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production content preview ready for Studio review","rows":[
              ["Trigger","Sanity Studio — deploy published content"],
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Next step","Review the preview, then Promote to live in production Studio"]
            ]}
