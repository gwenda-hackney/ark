name: Pages preview-then-production deploy

on:
  workflow_call:
    inputs:
      pages-project:
        required: true
        type: string
      pages-production-branch:
        required: true
        type: string
      production-deploy-branch:
        required: true
        type: string
      site-env:
        required: true
        type: string
      secret-profile:
        required: true
        type: string
      public-is-staging:
        required: true
        type: string
      public-opening-date:
        required: false
        type: string
        default: "2026-07-04"
      live-smoke-urls:
        required: true
        type: string
        description: Newline-separated URLs for post-cutover smoke tests
      tag-release:
        required: false
        type: boolean
        default: false
      summary-title:
        required: true
        type: string
      summary-site-url:
        required: true
        type: string
      ensure-custom-domain:
        required: false
        type: string
        default: ""
      ensure-zone-name:
        required: false
        type: string
        default: ""
      github-environment:
        required: true
        type: string
      github-environment-url:
        required: false
        type: string
        default: ""
      public-cf-beacon-token:
        required: false
        type: string
        default: ""
      baserow-table-id:
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SITE_PASSWORD:
        required: false
      GATE_BYPASS_KEY:
        required: false
      BASEROW_API_KEY:
        required: false
      SUBSCRIBE_SECRET:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.github-environment }}
      url: ${{ inputs.github-environment-url }}
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Resolve Web Analytics beacon token
        id: beacon
        run: echo "token=$(node scripts/resolve-beacon-token.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ inputs.public-cf-beacon-token }}

      - name: Ensure custom domain
        if: inputs.ensure-custom-domain != ''
        run: node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ inputs.pages-project }}
          CUSTOM_DOMAIN: ${{ inputs.ensure-custom-domain }}
          ZONE_NAME: ${{ inputs.ensure-zone-name }}

      - name: Record current production deployment
        id: current_prod
        run: node scripts/ci/get-production-deployment.mjs --project "${{ inputs.pages-project }}" --position current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        id: preview
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: ${{ inputs.pages-project }}
          pages-production-branch: ${{ inputs.pages-production-branch }}
          site-env: ${{ inputs.site-env }}
          secret-profile: ${{ inputs.secret-profile }}
          deploy-branch: ci-${{ steps.buildmeta.outputs.sha }}
          public-is-staging: ${{ inputs.public-is-staging }}
          public-opening-date: ${{ inputs.public-opening-date }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          beacon-token: ${{ steps.beacon.outputs.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-password: ${{ secrets.SITE_PASSWORD }}
          gate-bypass-key: ${{ secrets.GATE_BYPASS_KEY }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ inputs.baserow-table-id }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}

      - name: Smoke test preview
        run: node scripts/ci/smoke-test.mjs --url "${{ steps.preview.outputs.deployment_url }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      - name: Deploy production
        id: production
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: ${{ inputs.pages-project }}
          pages-production-branch: ${{ inputs.pages-production-branch }}
          site-env: ${{ inputs.site-env }}
          secret-profile: ${{ inputs.secret-profile }}
          deploy-branch: ${{ inputs.production-deploy-branch }}
          skip-build: "true"
          public-is-staging: ${{ inputs.public-is-staging }}
          public-opening-date: ${{ inputs.public-opening-date }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          beacon-token: ${{ steps.beacon.outputs.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-password: ${{ secrets.SITE_PASSWORD }}
          gate-bypass-key: ${{ secrets.GATE_BYPASS_KEY }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ inputs.baserow-table-id }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}

      - name: Smoke test live domain
        id: smoke_live
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            node scripts/ci/smoke-test.mjs --url "$url" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 6 --retry-delay-ms 3000
          done <<< "${{ inputs.live-smoke-urls }}"

      - name: Rollback production deployment
        if: failure() && steps.smoke_live.outcome == 'failure'
        run: node scripts/ci/rollback-pages-production.mjs --project "${{ inputs.pages-project }}" --deployment-id "${{ steps.current_prod.outputs.deployment_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Tag production release
        if: inputs.tag-release && success()
        run: node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      - name: Prune old previews
        if: success()
        run: node scripts/ci/prune-pages-previews.mjs --project "${{ inputs.pages-project }}" --keep-deployment-id "${{ steps.preview.outputs.deployment_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"${{ inputs.summary-title }}","rows":[
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Preview tested","${{ steps.preview.outputs.deployment_url }}"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Site","${{ inputs.summary-site-url }}"],
              ["Rollback","Cloudflare Pages rollback to `${{ steps.current_prod.outputs.deployment_id }}`"],
              ["Deployments","[GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=${{ inputs.site-env }})"]
            ]}
