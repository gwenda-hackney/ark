name: Extend recurring events

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report changes without publishing
        required: true
        default: false
        type: boolean

concurrency:
  group: extend-recurring-events
  cancel-in-progress: false

jobs:
  publish:
    name: Extend live event horizons
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull production ops secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ops:pull -- --github-env

      - name: Publish missing recurring dates
        env:
          SITE_ENV: production
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node ops/site/scripts/publish-recurring-events.mjs $ARGS
