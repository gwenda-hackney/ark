name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_OPENING_DATE: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}

      - name: Reject manual analytics beacon in build output
        run: |
          if rg -q 'cloudflareinsights\.com' dist/; then
            echo "dist/ contains manual Cloudflare Web Analytics embed — remove it from source"
            exit 1
          fi

      - name: Unit tests
        run: npm test
