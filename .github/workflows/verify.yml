name: Verify

on:
  workflow_call:
    inputs:
      sanity-dataset:
        description: Sanity dataset for build-time CMS fetch
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build -w @gwenda/web
        env:
          PUBLIC_OPENING_DATE: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          SANITY_PROJECT_ID: pn5yjro6
          SANITY_DATASET: ${{ inputs.sanity-dataset }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Verify Sanity menu content in build output
        run: node scripts/ci/verify-sanity-build.mjs
        working-directory: web

      - name: Reject manual analytics beacon in build output
        run: |
          if rg -q 'cloudflareinsights\.com' web/dist/; then
            echo "web/dist/ contains manual Cloudflare Web Analytics embed — remove it from source"
            exit 1
          fi

      - name: Unit tests
        run: npm test -w @gwenda/web

      - name: Brand colour tokens in sync
        run: npm run sync:brand -- --check
