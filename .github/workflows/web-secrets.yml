# Sync marketing web secrets: Bitwarden Secrets Manager (Ark + Ark/Web) → Cloudflare Pages.
#
# Cloudflare does not pull from Bitwarden. This job is the sync path.
# Trigger after rotating SM credentials, or on first wiring.
#
# Requires repo secret:
#   BWS_ACCESS_TOKEN       ark-ci (preferred) or ark-local machine-account token
#                          (must have access to Ark and Ark/Web)
# Cloudflare API token + account id come from SM project Ark via env:web:pull.
#
# The profile picks the Pages project: production (gwenda: live and its
# preview) or dev (gwenda-web-dev).

name: Web secrets

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Pages secret profile
        required: true
        type: choice
        options:
          - production
          - dev
        default: production

concurrency:
  group: web-secrets-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  sync:
    name: SM → Pages secrets (${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile ${{ inputs.profile == 'dev' && 'local' || 'production' }}

      - name: Push secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            node marketing/web/scripts/ci/sync-pages-secrets.mjs --project gwenda --profile production
          else
            node marketing/web/scripts/ci/sync-pages-secrets.mjs --project gwenda-web-dev --profile dev
          fi
