# Sync marketing web secrets: Bitwarden Secrets Manager (Ark/Web) → Cloudflare Pages.
#
# Cloudflare does not pull from Bitwarden. This job is the sync path.
# Trigger after rotating SM credentials, or on first wiring.
#
# Requires repo secrets:
#   BWS_ACCESS_TOKEN       ark-ci (preferred) or ark-local machine-account token
#                          (must have access to Ark/Web)
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Optional workflow input chooses staging vs production Pages project.

name: Web secrets

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Pages secret profile
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: web-secrets-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  sync:
    name: SM → Pages secrets (${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env

      - name: Push secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            node marketing/web/scripts/ci/sync-pages-secrets.mjs --project gwenda --profile production
          else
            node marketing/web/scripts/ci/sync-pages-secrets.mjs --project gwenda-staging --profile staging
          fi
