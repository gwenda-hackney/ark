name: Studio

# The hosted Studio (gwenda.sanity.studio) edits drafts in the real project's
# one dataset; ops publishes them. It deploys with the release: web-promote.yml
# redeploys it when its code changed, and this runs it by hand from release.

on:
  workflow_dispatch:

jobs:
  refuse-production-from-other-branches:
    name: Refuse production Studio off release
    if: github.ref_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: |
          echo "Production Studio deploys only from the release branch (got ${{ github.ref_name }})." >&2
          exit 1

  deploy-production:
    name: Deploy production Studio
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://gwenda.sanity.studio
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env

      - name: Deploy hosted Studio (production)
        run: npm run studio:deploy
        env:
          SANITY_DEPLOY_TOKEN: ${{ env.SANITY_DEPLOY_TOKEN }}

      - name: Deployment summary
        run: cd marketing/web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production Studio deployed","rows":[
              ["Studio","https://gwenda.sanity.studio"],
              ["Dataset","production"],
              ["Commit","[\\`${{ github.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"]
            ]}
