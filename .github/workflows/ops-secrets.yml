# Sync ops secrets: Bitwarden Secrets Manager → Cloudflare Pages (gwenda-ops).
#
# Cloudflare does not pull from Bitwarden. This job is the sync path.
# Trigger after rotating SM credentials, or on first wiring.
#
# Requires repo secret:
#   BWS_ACCESS_TOKEN       ark-ci (preferred) or ark-local machine-account token
#                          (must have access to Ark, Ark/Ops, and Ark/Web)
# Cloudflare API token + account id come from SM project Ark via env:ops:pull.
#
# Pages snapshots secrets per deployment: this workflow redeploys gwenda-ops
# after putting secrets so operations.gwenda.co.uk picks them up.

name: Ops secrets

on:
  workflow_dispatch:

concurrency:
  group: ops-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: SM → Pages secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/release" ]; then
            echo "Ops production secrets only redeploy from the release branch (got ${{ github.ref_name }})." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull Cloudflare credentials from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env

      - name: Push secrets to Cloudflare Pages (SM env=production)
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/setup-ops-secrets.mjs

      - name: Redeploy ops (secrets are snapshotted per deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production -w @gwenda/ops

      - name: Smoke test production auth gate
        run: node scripts/smoke-ops-auth.mjs https://gwenda-ops.pages.dev/ --retries 12 --retry-delay-ms 5000
