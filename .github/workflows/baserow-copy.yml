name: Baserow copy

# Copy a production Baserow database over its non-production copy, from the
# ops Website page (via the site-deploy webhook) or by hand. Production is
# only read. The copy keeps its database id: tables are reused, rows wiped
# and re-copied (--force). File values (photos) are not copied.
#
#   ops-dev          Gwenda / Gwenda Ops → Gwenda Dev copy (dev ops)
#   website-dev      Gwenda / Website → Gwenda Dev copy (dev website)
# Databases are found by name (scripts/lib/migrations.mjs DATABASES).
#
# Needs BASEROW_JWT_EMAIL / BASEROW_JWT_PASSWORD in Bitwarden SM: the clone
# scripts log in to Baserow to create any missing tables and columns.

run-name: baserow-copy-${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which copy to overwrite from production
        required: true
        type: choice
        options:
          - ops-dev
          - website-dev

concurrency:
  group: baserow-copy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  copy:
    name: Copy production → ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Pull production ops secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ops:pull -- --github-env

      - name: Baserow login
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      - name: Copy Ops DB to the Gwenda Dev copy
        if: inputs.target == 'ops-dev'
        run: node scripts/clone-baserow-ops-db.mjs --force

      - name: Copy Website DB to the Gwenda Dev copy
        if: inputs.target == 'website-dev'
        run: node scripts/clone-baserow-web-db.mjs --force

      - name: Summary
        run: |
          {
            echo "### Baserow copy: ${{ inputs.target }}"
            echo "Production was read, not changed. The copy's rows were replaced."
          } >> "$GITHUB_STEP_SUMMARY"
