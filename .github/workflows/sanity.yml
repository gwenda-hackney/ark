name: Sanity

# Mirror staging ↔ production datasets.
# Does not rebuild the website. Rebuild staging or promote to production afterwards.

on:
  workflow_dispatch:
    inputs:
      direction:
        description: Sync direction
        required: true
        type: choice
        options:
          - staging-to-production
          - production-to-staging
      confirm_target:
        description: Type the target dataset to overwrite (staging or production)
        required: true
        type: string

concurrency:
  group: sync-sanity-datasets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync datasets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release before overwriting production
        if: inputs.direction == 'staging-to-production'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/release" ]; then
            echo "Copying staging onto the production dataset only runs from the release branch (got ${{ github.ref_name }})." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve datasets
        id: datasets
        run: |
          case "${{ inputs.direction }}" in
            staging-to-production)
              echo "source=staging" >> "$GITHUB_OUTPUT"
              echo "target=production" >> "$GITHUB_OUTPUT"
              ;;
            production-to-staging)
              echo "source=production" >> "$GITHUB_OUTPUT"
              echo "target=staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown direction" >&2
              exit 1
              ;;
          esac

      - name: Require confirm_target
        run: |
          expected="${{ steps.datasets.outputs.target }}"
          got="${{ inputs.confirm_target }}"
          if [ "$got" != "$expected" ]; then
            echo "Refusing sync: confirm_target must be exactly \"$expected\" (got \"$got\")." >&2
            echo "This overwrites the entire target Sanity dataset." >&2
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sanity
        env:
          SANITY_PROJECT_ID: pn5yjro6
          SANITY_DATASET_SYNC_TOKEN: ${{ secrets.SANITY_DATASET_SYNC_TOKEN }}
        run: |
          node scripts/sync-sanity-datasets.mjs \
            --direction "${{ inputs.direction }}" \
            --confirm "${{ inputs.confirm_target }}"

      - name: Summary
        run: |
          {
            echo "## Sanity dataset sync"
            echo ""
            echo "- Direction: \`${{ inputs.direction }}\`"
            echo "- Source: \`${{ steps.datasets.outputs.source }}\`"
            echo "- Target overwritten: \`${{ steps.datasets.outputs.target }}\`"
            echo ""
            echo "CMS datasets are mirrored. Sites still serve the previous build until a rebuild or ops promote."
            if [ "${{ inputs.direction }}" = "staging-to-production" ]; then
              echo "Next: ops Web → Promote staging to production (clone already done; rebuild live)."
            else
              echo "Next: publish in Studio, rebuild gwenda-staging, review, then promote to production."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
