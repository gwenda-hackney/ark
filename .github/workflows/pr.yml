name: PR checks

# Checks every pull request into main, and the release PR from main into
# release (#301), for the apps it touches. The merge queue on main runs it
# again (merge_group) on each PR as it will land, on top of the ones ahead
# of it, so a PR never needs updating after another merges. Website builds and previews come
# from the branch push (web.yml branch preview); this workflow adds what
# nothing else runs: lint, and ops tests and build before merge. No secrets:
# nothing here talks to Sanity, D1 or Cloudflare.

on:
  pull_request:
    branches: [main, release]
  merge_group:
    types: [checks_requested]

concurrency:
  # A PR's runs replace each other; each queue entry has a branch of its own.
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ops: ${{ steps.filter.outputs.ops }}
      brand: ${{ steps.filter.outputs.brand }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          # In the queue, the change is the queue entry against main as it was.
          fetch-depth: ${{ github.event_name == 'merge_group' && 0 || 1 }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            web:
              - 'marketing/web/**'
              - 'marketing/brand/**'
              - 'shared/**'
              - 'package-lock.json'
              - '.github/workflows/pr.yml'
            ops:
              - 'ops/site/**'
              - 'shared/**'
              - 'scripts/**'
              # scripts/lib/pages-cleanup.mjs names branches with it.
              - '.github/scripts/cloudflare-pages-branch.mjs'
              # scripts/lib/rulesets.test.mjs checks it against this workflow.
              - '.github/rulesets/**'
              - 'vitest.config.mjs'
              - 'package-lock.json'
              - '.github/workflows/pr.yml'
            workers:
              - 'marketing/site-deploy-webhook/**'
              - 'marketing/subscribe-mailchimp-sync/**'
              - 'marketing/site-health/**'
              - 'marketing/wifi-captive-portal/**'
              - 'shared/**'
              - 'package-lock.json'
              - '.github/workflows/pr.yml'
            brand:
              - 'docs/brand/**'
              - 'scripts/brand-check.mjs'
              - 'scripts/lib/brand-images.mjs'

  web:
    name: Website (lint, tests, brand tokens)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Lint (ESLint + Prettier)
        run: npm run lint -w @gwenda/web

      - name: Unit tests
        run: npm test -w @gwenda/web

      - name: Brand colour tokens in sync
        run: npm run sync:brand -- --check

  ops:
    name: Ops (tests, type check, build)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Unit tests
        run: npm test -w @gwenda/ops

      - name: Shared and scripts tests
        run: npm run test:shared

      # Errors and warnings both fail the check (#22 cleared them).
      - name: Type check (svelte-check)
        run: npm run check -w @gwenda/ops -- --fail-on-warnings

      - name: Build
        run: npm run build -w @gwenda/ops

      # Pages as the owner uses them, in Chromium, with ops' /api answered by
      # the tests (ops/site/playwright.config.ts): no Functions or secrets.
      - name: Browser tests (Playwright)
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm run test:e2e -w @gwenda/ops

  # The Workers deploy from release (workers.yml), which ran their tests only
  # then, after the change had merged. Here they run before it can (#388).
  workers:
    name: Workers (tests, type check)
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - site-deploy-webhook
          - subscribe-mailchimp-sync
          - site-health
          - wifi-captive-portal
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Type check
        run: npm run typecheck -w @gwenda/${{ matrix.worker }}

      - name: Unit tests
        run: npm test -w @gwenda/${{ matrix.worker }}

  brand:
    name: Reference images (WebP, under the size cap)
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check docs/brand
        run: node scripts/brand-check.mjs

  # The check release's ruleset requires (.github/rulesets/release.json). The
  # jobs above skip apps a PR doesn't touch, and a required job that never
  # starts waits forever; this one runs on every PR and fails if any of them
  # failed or was cancelled. Renaming it means changing the ruleset too.
  release-checks:
    name: Release checks
    needs: [changes, web, ops, workers, brand]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: echo "changes=${{ needs.changes.result }} web=${{ needs.web.result }} ops=${{ needs.ops.result }} workers=${{ needs.workers.result }} brand=${{ needs.brand.result }}"

      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
