name: PR checks

# Checks every pull request into main, and the release PR from main into
# release (#301), for the apps it touches. Website builds and previews come
# from the branch push (web.yml branch preview); this workflow adds what
# nothing else runs: lint, and ops tests and build before merge. No secrets:
# nothing here talks to Baserow, Sanity or Cloudflare.

on:
  pull_request:
    branches: [main, release]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ops: ${{ steps.filter.outputs.ops }}
      brand: ${{ steps.filter.outputs.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'marketing/web/**'
              - 'marketing/brand/**'
              - 'shared/**'
              - 'package-lock.json'
              - '.github/workflows/pr.yml'
            ops:
              - 'ops/site/**'
              - 'shared/**'
              - 'scripts/**'
              # scripts/lib/pages-cleanup.mjs names branches with it.
              - '.github/scripts/cloudflare-pages-branch.mjs'
              # scripts/lib/rulesets.test.mjs checks it against this workflow.
              - '.github/rulesets/**'
              - 'vitest.config.mjs'
              - 'package-lock.json'
              - '.github/workflows/pr.yml'
            brand:
              - 'docs/brand/**'
              - 'scripts/brand-check.mjs'
              - 'scripts/lib/brand-images.mjs'

  web:
    name: Website (lint, tests, brand tokens)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Lint (ESLint + Prettier)
        run: npm run lint -w @gwenda/web

      - name: Unit tests
        run: npm test -w @gwenda/web

      - name: Brand colour tokens in sync
        run: npm run sync:brand -- --check

  ops:
    name: Ops (tests, type check, build)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Unit tests
        run: npm test -w @gwenda/ops

      - name: Shared and scripts tests
        run: npm run test:shared

      # Errors and warnings both fail the check (#22 cleared them).
      - name: Type check (svelte-check)
        run: npm run check -w @gwenda/ops -- --fail-on-warnings

      - name: Build
        run: npm run build -w @gwenda/ops

  brand:
    name: Reference images (WebP, under the size cap)
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check docs/brand
        run: node scripts/brand-check.mjs

  # The check release's ruleset requires (.github/rulesets/release.json). The
  # jobs above skip apps a PR doesn't touch, and a required job that never
  # starts waits forever; this one runs on every PR and fails if any of them
  # failed or was cancelled. Renaming it means changing the ruleset too.
  release-checks:
    name: Release checks
    needs: [changes, web, ops, brand]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: echo "changes=${{ needs.changes.result }} web=${{ needs.web.result }} ops=${{ needs.ops.result }} brand=${{ needs.brand.result }}"

      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
