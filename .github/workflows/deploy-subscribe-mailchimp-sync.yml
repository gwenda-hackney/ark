name: Deploy subscribe Mailchimp sync

on:
  push:
    branches:
      - main
    paths:
      - "utils/subscribe-mailchimp-sync/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-subscribe-mailchimp-sync.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @gwenda/subscribe-mailchimp-sync

      - name: Unit tests
        run: npm test -w @gwenda/subscribe-mailchimp-sync

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: utils/subscribe-mailchimp-sync

      - name: Sync Worker secrets
        run: |
          cd utils/subscribe-mailchimp-sync
          echo "$BASEROW_API_KEY" | npx wrangler secret put BASEROW_API_KEY
          echo "$MAILCHIMP_API_KEY" | npx wrangler secret put MAILCHIMP_API_KEY
          echo "$SUBSCRIBE_MAILCHIMP_SYNC_SECRET" | npx wrangler secret put SYNC_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          SUBSCRIBE_MAILCHIMP_SYNC_SECRET: ${{ secrets.SUBSCRIBE_MAILCHIMP_SYNC_SECRET }}
