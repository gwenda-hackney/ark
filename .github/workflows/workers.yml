name: Workers

# Production Workers: they deploy from release, in the production GitHub
# environment that holds the production Bitwarden token (#61).
on:
  push:
    branches:
      - release
    paths:
      - "marketing/site-deploy-webhook/**"
      - "marketing/subscribe-mailchimp-sync/**"
      - "marketing/site-health/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - site-deploy-webhook
          - subscribe-mailchimp-sync
          - site-health

jobs:
  changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      site_deploy: ${{ steps.set.outputs.site_deploy }}
      mailchimp: ${{ steps.set.outputs.mailchimp }}
      site_health: ${{ steps.set.outputs.site_health }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            site_deploy:
              - 'marketing/site-deploy-webhook/**'
              - '.github/workflows/workers.yml'
            mailchimp:
              - 'marketing/subscribe-mailchimp-sync/**'
              - '.github/workflows/workers.yml'
            site_health:
              - 'marketing/site-health/**'
              - '.github/workflows/workers.yml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            W="${{ inputs.worker }}"
            sd=false
            mc=false
            sh=false
            if [ "$W" = "all" ] || [ "$W" = "site-deploy-webhook" ]; then sd=true; fi
            if [ "$W" = "all" ] || [ "$W" = "subscribe-mailchimp-sync" ]; then mc=true; fi
            if [ "$W" = "all" ] || [ "$W" = "site-health" ]; then sh=true; fi
            echo "site_deploy=$sd" >> "$GITHUB_OUTPUT"
            echo "mailchimp=$mc" >> "$GITHUB_OUTPUT"
            echo "site_health=$sh" >> "$GITHUB_OUTPUT"
          else
            echo "site_deploy=${{ steps.filter.outputs.site_deploy }}" >> "$GITHUB_OUTPUT"
            echo "mailchimp=${{ steps.filter.outputs.mailchimp }}" >> "$GITHUB_OUTPUT"
            echo "site_health=${{ steps.filter.outputs.site_health }}" >> "$GITHUB_OUTPUT"
          fi

  site-deploy-webhook:
    name: Site deploy webhook
    needs: changes
    if: needs.changes.outputs.site_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: ./.github/actions/npm-install
      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env
      # DEPLOY_WEBHOOK_SECRET (web runtime key) and the GitHub token the Worker
      # dispatches workflows with (script-only, so exported by name).
      - name: Pull webhook secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          npm run env:web:pull -- --github-env
          node scripts/sm-export.mjs DISPATCH_TOKEN
      - run: npm run typecheck -w @gwenda/site-deploy-webhook
      - run: npm test -w @gwenda/site-deploy-webhook
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: marketing/site-deploy-webhook
      - name: Sync Worker secrets
        run: |
          cd marketing/site-deploy-webhook
          echo "$DEPLOY_WEBHOOK_SECRET" | npx wrangler secret put DEPLOY_WEBHOOK_SECRET
          echo "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WEBHOOK_SECRET: ${{ env.DEPLOY_WEBHOOK_SECRET }}
          DISPATCH_TOKEN: ${{ env.DISPATCH_TOKEN }}

  subscribe-mailchimp-sync:
    name: Subscribe Mailchimp sync
    needs: changes
    if: needs.changes.outputs.mailchimp == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: ./.github/actions/npm-install
      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env
      # BASEROW_API_KEY: the production Website token (Subscribers, Subscribe
      # sync runs). The Mailchimp credentials are script-only, exported by name.
      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          npm run env:web:pull -- --github-env
          node scripts/sm-export.mjs MAILCHIMP_API_KEY SUBSCRIBE_MAILCHIMP_SYNC_SECRET
      - run: npm run typecheck -w @gwenda/subscribe-mailchimp-sync
      - run: npm test -w @gwenda/subscribe-mailchimp-sync
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: marketing/subscribe-mailchimp-sync
      - name: Sync Worker secrets
        run: |
          cd marketing/subscribe-mailchimp-sync
          echo "$BASEROW_API_KEY" | npx wrangler secret put BASEROW_API_KEY
          echo "$MAILCHIMP_API_KEY" | npx wrangler secret put MAILCHIMP_API_KEY
          echo "$SUBSCRIBE_MAILCHIMP_SYNC_SECRET" | npx wrangler secret put SYNC_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          BASEROW_API_KEY: ${{ env.BASEROW_API_KEY }}
          MAILCHIMP_API_KEY: ${{ env.MAILCHIMP_API_KEY }}
          SUBSCRIBE_MAILCHIMP_SYNC_SECRET: ${{ env.SUBSCRIBE_MAILCHIMP_SYNC_SECRET }}

  site-health:
    name: Site health
    needs: changes
    if: needs.changes.outputs.site_health == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: ./.github/actions/npm-install
      - name: Pull Ark secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:ark:pull -- --github-env
      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env
      - run: npm run typecheck -w @gwenda/site-health
      - run: npm test -w @gwenda/site-health
      # Pre: the new code sends alerts through the Gmail API, so the Worker
      # needs the service account before it deploys. Old code ignores it.
      - name: Put Worker secrets
        run: |
          cd marketing/site-health
          printf '%s' "$GMAIL_SERVICE_ACCOUNT_JSON" | npx wrangler secret put GMAIL_SERVICE_ACCOUNT_JSON
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_SERVICE_ACCOUNT_JSON: ${{ env.GMAIL_SERVICE_ACCOUNT_JSON }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: marketing/site-health
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS https://health.gwenda.co.uk/health || true)"
            if printf '%s' "$body" | grep -q '"emailConfigured":true'; then
              echo "site-health is up and can send alerts."; exit 0
            fi
            sleep 10
          done
          echo "site-health smoke test failed: $body" >&2
          exit 1
      # Post: only the old SMTP code used this. Safe to run again.
      - name: Remove retired Worker secrets
        run: |
          cd marketing/site-health
          if npx wrangler secret list --format json | grep -q '"name": *"SMTP_PASSWORD"'; then
            npx wrangler secret delete SMTP_PASSWORD
          else
            echo "SMTP_PASSWORD already removed."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
