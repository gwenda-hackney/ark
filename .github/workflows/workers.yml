name: Workers

on:
  push:
    branches:
      - main
    paths:
      - "marketing/site-deploy-webhook/**"
      - "marketing/subscribe-mailchimp-sync/**"
      - "ops/recipe-cost-webhook/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - site-deploy-webhook
          - subscribe-mailchimp-sync
          - recipe-cost-webhook

jobs:
  changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      site_deploy: ${{ steps.set.outputs.site_deploy }}
      mailchimp: ${{ steps.set.outputs.mailchimp }}
      recipe_cost: ${{ steps.set.outputs.recipe_cost }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            site_deploy:
              - 'marketing/site-deploy-webhook/**'
              - '.github/workflows/workers.yml'
            mailchimp:
              - 'marketing/subscribe-mailchimp-sync/**'
              - '.github/workflows/workers.yml'
            recipe_cost:
              - 'ops/recipe-cost-webhook/**'
              - '.github/workflows/workers.yml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            W="${{ inputs.worker }}"
            sd=false
            mc=false
            rc=false
            if [ "$W" = "all" ] || [ "$W" = "site-deploy-webhook" ]; then sd=true; fi
            if [ "$W" = "all" ] || [ "$W" = "subscribe-mailchimp-sync" ]; then mc=true; fi
            if [ "$W" = "all" ] || [ "$W" = "recipe-cost-webhook" ]; then rc=true; fi
            echo "site_deploy=$sd" >> "$GITHUB_OUTPUT"
            echo "mailchimp=$mc" >> "$GITHUB_OUTPUT"
            echo "recipe_cost=$rc" >> "$GITHUB_OUTPUT"
          else
            echo "site_deploy=${{ steps.filter.outputs.site_deploy }}" >> "$GITHUB_OUTPUT"
            echo "mailchimp=${{ steps.filter.outputs.mailchimp }}" >> "$GITHUB_OUTPUT"
            echo "recipe_cost=${{ steps.filter.outputs.recipe_cost }}" >> "$GITHUB_OUTPUT"
          fi

  site-deploy-webhook:
    name: Site deploy webhook
    needs: changes
    if: needs.changes.outputs.site_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w @gwenda/site-deploy-webhook
      - run: npm test -w @gwenda/site-deploy-webhook
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: marketing/site-deploy-webhook
      - name: Sync Worker secrets
        run: |
          cd marketing/site-deploy-webhook
          echo "$DEPLOY_WEBHOOK_SECRET" | npx wrangler secret put DEPLOY_WEBHOOK_SECRET
          echo "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  subscribe-mailchimp-sync:
    name: Subscribe Mailchimp sync
    needs: changes
    if: needs.changes.outputs.mailchimp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w @gwenda/subscribe-mailchimp-sync
      - run: npm test -w @gwenda/subscribe-mailchimp-sync
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: marketing/subscribe-mailchimp-sync
      - name: Sync Worker secrets
        run: |
          cd marketing/subscribe-mailchimp-sync
          echo "$BASEROW_API_KEY" | npx wrangler secret put BASEROW_API_KEY
          echo "$MAILCHIMP_API_KEY" | npx wrangler secret put MAILCHIMP_API_KEY
          echo "$SUBSCRIBE_MAILCHIMP_SYNC_SECRET" | npx wrangler secret put SYNC_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          SUBSCRIBE_MAILCHIMP_SYNC_SECRET: ${{ secrets.SUBSCRIBE_MAILCHIMP_SYNC_SECRET }}

  recipe-cost-webhook:
    name: Recipe cost webhook
    needs: changes
    if: needs.changes.outputs.recipe_cost == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w @gwenda/recipe-cost-webhook
      - run: npm test -w @gwenda/recipe-cost-webhook
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ops/recipe-cost-webhook
