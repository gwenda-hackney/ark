name: Deploy recipe cost webhook

on:
  push:
    branches:
      - main
    paths:
      - "utils/recipe-cost-webhook/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-recipe-cost-webhook.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @gwenda/recipe-cost-webhook

      - name: Unit tests
        run: npm test -w @gwenda/recipe-cost-webhook

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: utils/recipe-cost-webhook
