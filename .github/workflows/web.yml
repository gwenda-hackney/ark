name: Web

# Marketing site. Two environments, built the same way (docs/sanity.md):
#
#   dev   gwenda-web-dev, Gwenda Dev Sanity: every push to main builds both
#         sites (live = main branch, preview = "preview" branch), and dev ops
#         asks for one (dev-preview / dev-live) through the deploy webhook.
#   prod  gwenda: every push to release builds the preview ("preview" branch:
#         drafts over published, password-gated); ops asks for content
#         rebuilds (preview). The live site is web-promote.yml.
#
# Other branches get a branch preview on the dev website, with dev data.

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && inputs.action ||
    format('push-{0}', github.ref_name)
  }}

on:
  push:
    paths:
      - "marketing/web/**"
      - "shared/**"
      - "package-lock.json"
      - ".github/workflows/web.yml"
      - ".github/actions/deploy-pages/**"
      - ".github/scripts/cloudflare-pages-branch.mjs"
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        required: true
        type: choice
        default: auto
        options:
          - auto
          - preview
          - dev-preview
          - dev-live

jobs:
  # Which deploy runs is decided by each job's `if` (no separate resolve job,
  # which cost a runner start before anything deployed):
  #   push to main or action auto/dev-*   -> dev website (both sites on push)
  #   push to release or action preview   -> prod preview
  #   push to any other branch            -> branch preview on the dev website
  deploy-dev:
    name: Deploy dev website (${{ matrix.site }})
    if: >-
      (github.ref_name == 'main' && (github.event_name == 'push' || inputs.action == 'auto')) ||
      inputs.action == 'dev-preview' || inputs.action == 'dev-live'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both sites when main's code changes, else the one dev ops asked for.
        site: >-
          ${{ fromJSON(inputs.action == 'dev-preview' && '["preview"]' ||
          inputs.action == 'dev-live' && '["live"]' || '["preview","live"]') }}
    concurrency:
      group: web-dev-${{ matrix.site }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: dev
      url: ${{ matrix.site == 'live' && 'https://gwenda-web-dev.pages.dev' || 'https://preview.gwenda-web-dev.pages.dev' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Compute build metadata
        id: buildmeta
        run: cd marketing/web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: main
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.run_started_at }}

      # The dev secrets (NAME__DEV): Gwenda Dev Sanity, the dev Ops and
      # Website Baserow copies.
      - name: Pull dev web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile dev

      # Once per push: the same code builds both sites.
      - name: Unit tests
        if: matrix.site == 'live'
        run: npm test -w @gwenda/web

      - name: Brand colour tokens in sync
        if: matrix.site == 'live'
        run: npm run sync:brand -- --check

      # Baserow schema changes need a user login (database tokens only touch rows).
      - name: Baserow login for migrations
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      # Additive only, so the website still running keeps working (scripts/lib/migrations.mjs).
      - name: Migrations before deploy
        run: node scripts/migrate.mjs --app web --phase pre --env dev

      - name: Deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda-web-dev
          pages-production-branch: main
          deploy-branch: ${{ matrix.site == 'live' && 'main' || 'preview' }}
          wrangler-config: wrangler.dev.toml
          public-is-preview: "true"
          env-label: ${{ matrix.site == 'live' && 'Dev' || 'Dev · preview' }}
          site-origin: ${{ matrix.site == 'live' && 'https://gwenda-web-dev.pages.dev' || 'https://preview.gwenda-web-dev.pages.dev' }}
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          sanity-api-token: ${{ env.SANITY_API_TOKEN }}
          sanity-project-id: gwscpagy
          sanity-perspective: ${{ matrix.site == 'live' && 'published' || 'previewDrafts' }}
          baserow-ops-api-key: ${{ env.BASEROW_OPS_API_KEY }}
          secrets-profile: dev
          snapshot-site: ${{ matrix.site == 'live' && 'production' || 'preview' }}
          snapshot-environment: dev

      - name: Smoke test
        env:
          SMOKE_TEST_GATE_BYPASS_KEY: ${{ env.GATE_BYPASS_KEY }}
        run: cd marketing/web && node scripts/ci/smoke-test.mjs --url "${{ matrix.site == 'live' && 'https://gwenda-web-dev.pages.dev' || 'https://preview.gwenda-web-dev.pages.dev' }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      # The new code is live: remove what only the old code used.
      - name: Migrations after deploy
        run: node scripts/migrate.mjs --app web --phase post --env dev

  # Prod's preview: the release code on drafts over published. A push to
  # release builds it with the new code; ops's content rebuilds dispatch it on
  # release too, since the production environment only accepts release (#60).
  deploy-preview:
    name: Deploy preview
    if: >-
      (github.ref_name == 'release' && (github.event_name == 'push' || inputs.action == 'auto')) ||
      inputs.action == 'preview'
    runs-on: ubuntu-latest
    concurrency:
      group: web-preview
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://preview.gwenda-blue.pages.dev
    steps:
      - name: Require the release branch on push
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/release" ]; then
            echo "The preview deploys only from release (got ${{ github.ref_name }})." >&2
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'release' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Compute build metadata
        id: buildmeta
        run: cd marketing/web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: release
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.run_started_at }}

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile production

      - name: Unit tests
        run: npm test -w @gwenda/web

      - name: Brand colour tokens in sync
        run: npm run sync:brand -- --check

      # Baserow schema changes need a user login (database tokens only touch rows).
      - name: Baserow login for migrations
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      # Additive only: the live site still runs the old code. Never post here;
      # post-deploy migrations run when web-promote puts this code live.
      - name: Migrations before deploy
        run: node scripts/migrate.mjs --app web --phase pre --env production

      - name: Deploy preview
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          deploy-branch: preview
          wrangler-config: wrangler.toml
          public-is-preview: "true"
          env-label: Preview
          site-origin: https://preview.gwenda-blue.pages.dev
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          sanity-api-token: ${{ env.SANITY_API_TOKEN }}
          sanity-perspective: previewDrafts
          baserow-ops-api-key: ${{ env.BASEROW_OPS_API_KEY }}
          secrets-profile: production
          snapshot-site: preview

      - name: Smoke test preview
        env:
          SMOKE_TEST_GATE_BYPASS_KEY: ${{ env.GATE_BYPASS_KEY }}
        # Live settings: a test email and a real play-form submission (both to
        # alerts@gwenda.co.uk, test row deleted) before anything goes live.
        run: cd marketing/web && node scripts/ci/smoke-test.mjs --url https://preview.gwenda-blue.pages.dev --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000 --deep --send-email --form-test

      - name: Deployment summary
        run: cd marketing/web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Preview ready","rows":[
              ["Preview","[https://preview.gwenda-blue.pages.dev](https://preview.gwenda-blue.pages.dev)"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Live site","unchanged"]
            ]}

  # Unreleased code belongs in dev: a branch preview is the dev website on its
  # own Pages branch, with dev data.
  # Lint, tests and brand checks for branches run in pr.yml; this only deploys.
  deploy-branch-preview:
    name: Deploy branch preview
    if: >-
      github.ref_name != 'main' && github.ref_name != 'release' &&
      (github.event_name == 'push' || inputs.action == 'auto')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.preview_url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Resolve Pages preview branch
        id: branch
        run: |
          NAME=$(node .github/scripts/cloudflare-pages-branch.mjs '${{ github.ref_name }}')
          if [ "$NAME" = "main" ] || [ "$NAME" = "release" ] || [ "$NAME" = "preview" ]; then
            NAME="branch-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: buildmeta
        run: cd marketing/web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Pull dev web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile dev

      - name: Deploy preview
        id: deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda-web-dev
          pages-production-branch: main
          deploy-branch: ${{ steps.branch.outputs.name }}
          wrangler-config: wrangler.dev.toml
          public-is-preview: "true"
          env-label: Dev · ${{ steps.branch.outputs.name }}
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          sanity-api-token: ${{ env.SANITY_API_TOKEN }}
          sanity-project-id: gwscpagy
          sanity-perspective: previewDrafts
          baserow-ops-api-key: ${{ env.BASEROW_OPS_API_KEY }}
          secrets-profile: dev

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ steps.branch.outputs.name }}.gwenda-web-dev.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        env:
          SMOKE_TEST_GATE_BYPASS_KEY: ${{ env.GATE_BYPASS_KEY }}
        run: cd marketing/web && node scripts/ci/smoke-test.mjs --url "${{ steps.preview_url.outputs.url }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      - name: Link the preview on the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-preview-comment.mjs --app web --url "${{ steps.preview_url.outputs.url }}"

      - name: Deployment summary
        run: cd marketing/web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Web — branch preview (dev data)","rows":[
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Pages branch","`${{ steps.branch.outputs.name }}`"],
              ["Git branch","`${{ github.ref_name }}`"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"]
            ]}
