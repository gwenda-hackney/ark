name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    environment:
      name: staging
      url: https://staging.gwenda.co.uk
    uses: ./.github/workflows/pages-preview-production.yml
    with:
      pages-project: gwenda-staging
      pages-production-branch: main
      production-deploy-branch: main
      site-env: staging
      secret-profile: staging
      public-is-staging: "true"
      public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
      live-smoke-urls: |
        https://staging.gwenda.co.uk
      tag-release: false
      summary-title: Staging deployed
      summary-site-url: https://staging.gwenda.co.uk
      ensure-custom-domain: staging.gwenda.co.uk
      ensure-zone-name: gwenda.co.uk
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GATE_BYPASS_KEY: ${{ secrets.GATE_BYPASS_KEY }}
      BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
      BASEROW_TABLE_ID: ${{ vars.BASEROW_STAGING_TABLE_ID || '1024006' }}
      SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
