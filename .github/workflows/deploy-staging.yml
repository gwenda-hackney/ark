name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    uses: ./.github/workflows/deploy-environment.yml
    with:
      pages-project: gwenda-staging
      pages-production-branch: main
      site-env: staging
      secret-profile: staging
      public-is-staging: "true"
      public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
      smoke-test-urls: |
        https://staging.gwenda.co.uk
      summary-title: Staging deployed
      summary-site-url: https://staging.gwenda.co.uk
      summary-pages-dev-url: https://gwenda-staging.pages.dev
      ensure-custom-domain: staging.gwenda.co.uk
      ensure-zone-name: gwenda.co.uk
      github-environment: staging
      github-environment-url: https://staging.gwenda.co.uk
      public-cf-beacon-token: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      baserow-table-id: ${{ vars.BASEROW_STAGING_TABLE_ID || '1024006' }}
      tag-release: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GATE_BYPASS_KEY: ${{ secrets.GATE_BYPASS_KEY }}
      BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
      SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
