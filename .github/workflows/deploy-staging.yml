name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://gwenda-staging.pages.dev

    env:
      PAGES_PROJECT_NAME: gwenda-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set build timestamp
        id: buildmeta
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute build version
        id: version
        run: |
          TIME="${{ github.event.head_commit.timestamp || steps.buildmeta.outputs.time }}"
          SHA="${{ github.sha }}"
          CAL=$(date -u -d "$TIME" +%Y.%m.%d 2>/dev/null || date -u +%Y.%m.%d)
          SHORT=$(echo "$SHA" | cut -c1-7)
          echo "value=${CAL}+${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Resolve Web Analytics beacon token
        id: beacon
        run: echo "token=$(node scripts/resolve-beacon-token.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Build (staging)
        run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ steps.beacon.outputs.token }}
          PUBLIC_IS_STAGING: "true"
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          PUBLIC_BUILD_REF: ${{ github.ref_name }}
          PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp || steps.buildmeta.outputs.time }}
          PUBLIC_BUILD_VERSION: ${{ steps.version.outputs.value }}
          PUBLIC_OPENING_DATE: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}

      - name: Ensure Pages project exists
        run: node scripts/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda-staging
          PAGES_PRODUCTION_BRANCH: main

      - name: Pin staging environment
        run: node scripts/ensure-pages-env.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda-staging
          SITE_ENV: staging

      - name: Set site password
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "SITE_PASSWORD is required for staging deploys."
            exit 1
          fi
          printf '%s' "$SITE_PASSWORD" | ./node_modules/.bin/wrangler pages secret put SITE_PASSWORD --project-name=gwenda-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Set gate bypass key
        run: |
          if [ -n "$GATE_BYPASS_KEY" ]; then
            printf '%s' "$GATE_BYPASS_KEY" | ./node_modules/.bin/wrangler pages secret put GATE_BYPASS_KEY --project-name=gwenda-staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE_BYPASS_KEY: ${{ secrets.GATE_BYPASS_KEY }}

      - name: Set Baserow secrets
        run: |
          if [ -n "$BASEROW_API_KEY" ]; then
            printf '%s' "$BASEROW_API_KEY" | ./node_modules/.bin/wrangler pages secret put BASEROW_API_KEY --project-name=gwenda-staging
          fi
          if [ -n "$BASEROW_TABLE_ID" ]; then
            printf '%s' "$BASEROW_TABLE_ID" | ./node_modules/.bin/wrangler pages secret put BASEROW_TABLE_ID --project-name=gwenda-staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASEROW_API_KEY: ${{ secrets.BASEROW_API_KEY }}
          BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gwenda-staging --commit-hash=${{ github.sha }} --branch=${{ github.ref_name }}

      - name: Deployment summary
        run: |
          {
            echo "## Staging deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`${{ steps.version.outputs.value }}\` |"
            echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Site** | https://gwenda-staging.pages.dev |"
            echo "| **Deployments** | [GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=staging) |"
          } >> "$GITHUB_STEP_SUMMARY"
