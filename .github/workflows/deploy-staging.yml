name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://gwenda-staging.pages.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Resolve Web Analytics beacon token
        id: beacon
        run: echo "token=$(node scripts/resolve-beacon-token.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Deploy staging
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda-staging
          pages-production-branch: main
          site-env: staging
          secret-profile: staging
          deploy-branch: ${{ github.ref_name }}
          public-is-staging: "true"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-07-04' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          beacon-token: ${{ steps.beacon.outputs.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-password: ${{ secrets.SITE_PASSWORD }}
          gate-bypass-key: ${{ secrets.GATE_BYPASS_KEY }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}

      - name: Deployment summary
        run: node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Staging deployed","rows":[
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Site","https://gwenda-staging.pages.dev"],
              ["Deployments","[GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=staging)"]
            ]}
