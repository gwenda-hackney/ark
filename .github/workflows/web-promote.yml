name: Web promote

# Builds and deploys the release branch to gwenda.co.uk. Refuses any other
# branch. Does not move release, and does not deploy ops.
#
# Content is not copied here. Ops Website > Staging → live copies reviewed staging
# documents onto production and then starts this workflow to rebuild. A
# dataset clone would also carry staging drafts (local ops previews) and
# anything nobody reviewed.

run-name: promote-release-to-production

on:
  workflow_dispatch:

concurrency:
  group: web-promote-staging-to-production
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy release to live
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      actions: read
    environment:
      name: production
      url: https://gwenda.co.uk
    steps:
      - name: Require the release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/release" ]; then
            echo "The live website promotes only from the release branch (got ${{ github.ref_name }})." >&2
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Resolve release SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Compute build metadata
        id: buildmeta
        run: cd marketing/web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: release
          BUILD_COMMIT_SHA: ${{ steps.sha.outputs.sha }}

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile production


      - name: Deploy production
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          deploy-branch: release
          wrangler-config: wrangler.toml
          public-is-staging: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          sanity-api-token: ${{ env.SANITY_API_TOKEN }}
          sanity-dataset: production
          secrets-profile: production
          snapshot-site: production
          baserow-ops-api-key: ${{ env.BASEROW_OPS_API_KEY }}
          baserow-ops-database-id: "556507"

      - name: Ensure apex custom domain
        run: cd marketing/web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: gwenda.co.uk

      - name: Ensure www custom domain
        run: cd marketing/web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: www.gwenda.co.uk

      - name: Allow AI crawlers on production zone
        run: cd marketing/web && node scripts/ensure-zone-ai-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_NAME: gwenda.co.uk

      - name: Smoke test live domains
        run: |
          for url in https://gwenda.co.uk https://www.gwenda.co.uk; do
            (cd marketing/web && node scripts/ci/smoke-test.mjs --url "$url" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000)
          done

      # Studio only needs redeploying when its code changed (~30s otherwise).
      - name: Did Studio change since the last release?
        id: studio
        run: |
          last=$(git describe --tags --abbrev=0 --match '20*' HEAD^ 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- marketing/studio package-lock.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Studio unchanged since $last; skipping its deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production Studio
        if: steps.studio.outputs.changed == 'true'
        run: npm run studio:deploy
        env:
          SANITY_DEPLOY_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          SANITY_STUDIO_SITE_DEPLOY_URL: ${{ secrets.SANITY_STUDIO_SITE_DEPLOY_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}

      - name: Tag production release
        run: cd marketing/web && node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      - name: Deployment summary
        run: cd marketing/web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Release deployed to production","rows":[
              ["Commit","[\\`${{ steps.sha.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.sha.outputs.sha }})"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Site","https://gwenda.co.uk"]
            ]}
