name: Web promote

# Builds and deploys the release branch to gwenda.co.uk. Refuses any other
# branch. Does not move release, and does not deploy ops.
#
# Content is not copied here. Ops publishes the drafts the editor checked on
# the preview (Put on website, Website > Preview → live), then this rebuilds
# the live site from published documents only.
#
# `reason: content` (the deploy webhook, when ops publishes) is the short path
# (#16): the code is what's live already, so the domain, crawler, Studio and
# migration steps, the test email and the release tag are skipped, and the
# checkout is shallow. A run started by hand is `code` and runs everything.

run-name: promote-release-to-production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "code: every check (by hand). content: ops publishing content."
        type: choice
        options: [code, content]
        default: code

concurrency:
  group: web-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy release to live
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      # actions: write to rebuild after a content migration (below).
      actions: write
      pull-requests: read
    environment:
      name: production
      url: https://gwenda.co.uk
    steps:
      - name: Require the release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/release" ]; then
            echo "The live website promotes only from the release branch (got ${{ github.ref_name }})." >&2
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          # Full history only for the code path's "did Studio change" tag comparison.
          fetch-depth: ${{ inputs.reason == 'content' && 1 || 0 }}

      - name: Resolve release SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Compute build metadata
        id: buildmeta
        run: cd marketing/web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: release
          BUILD_COMMIT_SHA: ${{ steps.sha.outputs.sha }}

      - name: Pull web secrets from Bitwarden SM
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: npm run env:web:pull -- --github-env --profile production


      # Baserow schema changes need a user login (database tokens only touch rows).
      - name: Baserow login for migrations
        if: inputs.reason != 'content'
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs BASEROW_JWT_EMAIL BASEROW_JWT_PASSWORD

      # D1 schema first (db/<role>/migrations, #191): it only adds, and skips databases not created yet.
      - name: D1 schema migrations
        run: node scripts/d1-migrate.mjs --env production

      # Additive only, so the website still running keeps working (scripts/lib/migrations.mjs).
      - name: Migrations before deploy
        if: inputs.reason != 'content'
        run: node scripts/migrate.mjs --app web --phase pre --env production

      # What to roll back to if a check after the deploy fails (#18).
      - name: Remember the live deployment
        id: previous
        run: node scripts/pages-rollback.mjs remember --project gwenda --url https://gwenda.co.uk

      - name: Deploy production
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          deploy-branch: release
          wrangler-config: wrangler.toml
          public-is-preview: "false"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          sanity-api-token: ${{ env.SANITY_API_TOKEN }}
          sanity-dataset: production
          secrets-profile: production
          snapshot-site: production
          baserow-ops-api-key: ${{ env.BASEROW_OPS_API_KEY }}

      - name: Ensure apex custom domain
        if: inputs.reason != 'content'
        run: cd marketing/web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: gwenda.co.uk

      - name: Ensure www custom domain
        if: inputs.reason != 'content'
        run: cd marketing/web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: www.gwenda.co.uk

      - name: Allow AI crawlers on production zone
        if: inputs.reason != 'content'
        run: cd marketing/web && node scripts/ensure-zone-ai-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_NAME: gwenda.co.uk

      - name: Smoke test live domains
        run: |
          for url in https://gwenda.co.uk https://www.gwenda.co.uk; do
            (cd marketing/web && node scripts/ci/smoke-test.mjs --url "$url" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000)
          done

      # Databases, config, and a real play-form submission on every promote:
      # secrets change without code changing, so a broken key must show here.
      # Two emails to alerts@gwenda.co.uk, subjects starting "Smoke test:";
      # the test row is deleted.
      # Content runs check the same, read-only: no test email or form row.
      - name: Deep health (databases, email, forms)
        run: cd marketing/web && node scripts/ci/smoke-test.mjs --url https://gwenda.co.uk --expected-version "${{ steps.buildmeta.outputs.version }}" --deep ${{ inputs.reason != 'content' && '--form-test' || '' }}

      # Any failure since the deploy: put the previous deployment back (and its
      # secrets). It must stay before the post migrations, which remove what
      # the old code reads; a failed job skips them, so they haven't run.
      - name: Roll back to the previous deployment
        id: rollback
        if: failure() && steps.previous.outputs.previous-id != ''
        run: node scripts/pages-rollback.mjs rollback --project gwenda --to "${{ steps.previous.outputs.previous-id }}"

      - name: Check the previous version is live again
        if: failure() && steps.rollback.outcome == 'success' && steps.previous.outputs.previous-version != ''
        run: cd marketing/web && node scripts/ci/smoke-test.mjs --url https://gwenda.co.uk --expected-version "${{ steps.previous.outputs.previous-version }}" --retries 18 --retry-delay-ms 5000

      # The new code is live: remove what only the old code used, and what the
      # smoke test left (smoke-test-cleanup.mjs, which needs the Mailchimp key).
      - name: Mailchimp key for the smoke-test cleanup
        if: inputs.reason != 'content'
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: node scripts/sm-export.mjs MAILCHIMP_API_KEY
      - name: Migrations after deploy
        id: post-migrations
        if: inputs.reason != 'content'
        run: node scripts/migrate.mjs --app web --phase post --env production

      # The live site and production's preview were built before a migration
      # changed their content: build them again from it, as ops publishing
      # does. The content promote queues behind this run (concurrency).
      - name: Rebuild with the migrated content
        if: steps.post-migrations.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run web-promote.yml --ref release -f reason=content
          gh workflow run web.yml --ref release -f action=preview

      # Studio only needs redeploying when its code changed (~30s otherwise).
      - name: Did Studio change since the last release?
        id: studio
        if: inputs.reason != 'content'
        run: |
          last=$(git describe --tags --abbrev=0 --match '20*' HEAD^ 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- marketing/studio package-lock.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Studio unchanged since $last; skipping its deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production Studio
        if: steps.studio.outputs.changed == 'true'
        run: npm run studio:deploy
        env:
          SANITY_DEPLOY_TOKEN: ${{ env.SANITY_DEPLOY_TOKEN }}

      - name: Tag production release
        if: inputs.reason != 'content'
        run: cd marketing/web && node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      # The PRs merged since the last release; none (content only) → no release.
      - name: GitHub Release with changelog
        if: inputs.reason != 'content'
        run: node scripts/release.mjs --app web --version "${{ steps.buildmeta.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deployment summary
        run: cd marketing/web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Release deployed to production","rows":[
              ["Commit","[\\`${{ steps.sha.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.sha.outputs.sha }})"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Site","https://gwenda.co.uk"]
            ]}
