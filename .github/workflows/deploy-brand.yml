name: Deploy brand guidelines

on:
  push:
    branches:
      - main
      - release
    paths:
      - "brand/**"
      - "web/src/config/colors.json"
      - ".github/scripts/sync-brand-tokens.mjs"
      - ".github/workflows/deploy-brand.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync brand colour tokens
        run: npm run sync:brand

      - name: Verify brand tokens committed
        run: npm run sync:brand -- --check

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name gwenda-brand --branch main --commit-dirty=true
          workingDirectory: brand
