name: Deploy brand guidelines

on:
  push:
    branches:
      - main
      - release
    paths:
      - "brand/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync brand colour tokens
        run: npm run sync:brand

      - name: Verify brand tokens committed
        run: npm run sync:brand -- --check

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src --project-name gwenda-brand --branch main --commit-dirty=true
          workingDirectory: brand

      - name: Smoke test deployment
        run: |
          url="https://gwenda-brand.pages.dev/"
          for i in $(seq 1 12); do
            if curl -fsS "$url" | grep -q "Gwenda — Brand Guidelines"; then
              echo "OK $url"
              exit 0
            fi
            echo "Waiting for deployment… ($i/12)"
            sleep 5
          done
          echo "Brand guidelines not served at $url"
          exit 1
