name: Promote production to live

on:
  workflow_dispatch:

jobs:
  promote:
    name: Promote preview to live
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      actions: read
    environment:
      name: production
      url: https://gwenda.co.uk

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Resolve release HEAD
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release matches last preview
        id: preview
        run: cd web && node scripts/ci/verify-previewed-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}

      - name: Download previewed dist artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          run-id: ${{ steps.preview.outputs.preview-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: web/dist

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute build metadata
        id: buildmeta
        run: cd web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_REF_NAME: release
          BUILD_COMMIT_SHA: ${{ steps.preview.outputs.sha }}

      - name: Deploy previewed dist to production branch
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda
          pages-production-branch: release
          secret-profile: production
          deploy-branch: release
          wrangler-config: wrangler.toml
          skip-build: "true"
          public-is-staging: "false"
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_TABLE_ID }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}

      - name: Ensure apex custom domain
        run: cd web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: gwenda.co.uk

      - name: Ensure www custom domain
        run: cd web && node scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: gwenda
          ZONE_NAME: gwenda.co.uk
          CUSTOM_DOMAIN: www.gwenda.co.uk

      - name: Allow AI crawlers on production zone
        run: cd web && node scripts/ensure-zone-ai-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_NAME: gwenda.co.uk

      - name: Smoke test live domains
        run: |
          for url in https://gwenda.co.uk https://www.gwenda.co.uk; do
            (cd web && node scripts/ci/smoke-test.mjs --url "$url" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000)
          done

      - name: Tag production release
        run: cd web && node scripts/ci/tag-production-release.mjs
        env:
          RELEASE_VERSION: ${{ steps.buildmeta.outputs.version }}

      - name: Deployment summary
        run: cd web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Production deployed","rows":[
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Preview run","[${{ steps.preview.outputs.preview-run-url }}](${{ steps.preview.outputs.preview-run-url }})"],
              ["Site","https://gwenda.co.uk"],
              ["Deployments","[GitHub Environments](${{ github.server_url }}/${{ github.repository }}/deployments/activity_log?environment=production)"]
            ]}
