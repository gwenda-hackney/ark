name: Deploy web preview

on:
  push:
    branches-ignore:
      - main
      - release
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web-preview.yml"
      - ".github/workflows/verify.yml"
      - ".github/actions/deploy-pages/**"
      - ".github/scripts/cloudflare-pages-branch.mjs"
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      sanity-dataset: development

  deploy-preview:
    name: Deploy web (branch preview)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      deployments: write
    environment:
      name: web-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages preview branch
        id: branch
        run: |
          NAME=$(node .github/scripts/cloudflare-pages-branch.mjs '${{ github.ref_name }}')
          if [ "$NAME" = "main" ] || [ "$NAME" = "release" ]; then
            NAME="preview-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: buildmeta
        run: cd web && node scripts/ci/compute-build-metadata.mjs
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: ./.github/actions/deploy-pages
        with:
          pages-project: gwenda-staging
          pages-production-branch: main
          secret-profile: staging
          deploy-branch: ${{ steps.branch.outputs.name }}
          wrangler-config: wrangler.staging.toml
          public-is-staging: "true"
          public-opening-date: ${{ vars.PUBLIC_OPENING_DATE || '2026-08-01' }}
          public-booking-enabled-from: ${{ vars.PUBLIC_BOOKING_ENABLED_FROM || '' }}
          build-version: ${{ steps.buildmeta.outputs.version }}
          build-sha: ${{ steps.buildmeta.outputs.sha }}
          build-ref: ${{ steps.buildmeta.outputs.ref }}
          build-time: ${{ steps.buildmeta.outputs.time }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-password: ${{ secrets.SITE_PASSWORD }}
          gate-bypass-key: ${{ secrets.GATE_BYPASS_KEY }}
          baserow-api-key: ${{ secrets.BASEROW_API_KEY }}
          baserow-table-id: ${{ vars.BASEROW_STAGING_TABLE_ID || '1024006' }}
          subscribe-secret: ${{ secrets.SUBSCRIBE_SECRET }}
          event-admin-secret: ${{ secrets.EVENT_ADMIN_SECRET }}
          invite-base-url: https://gwenda-staging.pages.dev
          invite-image-url: https://gwenda.co.uk/images/event-invite.jpg
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          smtp-from: ${{ secrets.SMTP_FROM }}
          instagram-access-token: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          instagram-business-account-id: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          invite-email-subject: ${{ secrets.INVITE_EMAIL_SUBJECT }}
          invite-email-body: ${{ secrets.INVITE_EMAIL_BODY }}
          invite-instagram-message: ${{ secrets.INVITE_INSTAGRAM_MESSAGE }}
          sanity-api-token: ${{ secrets.SANITY_API_TOKEN }}
          sanity-dataset: development

      - name: Resolve preview URL
        id: preview_url
        run: |
          URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://${{ steps.branch.outputs.name }}.gwenda-staging.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        env:
          SMOKE_TEST_GATE_BYPASS_KEY: ${{ secrets.GATE_BYPASS_KEY }}
        run: cd web && node scripts/ci/smoke-test.mjs --url "${{ steps.preview_url.outputs.url }}" --expected-version "${{ steps.buildmeta.outputs.version }}" --retries 18 --retry-delay-ms 5000

      - name: Deployment summary
        run: cd web && node scripts/ci/write-deployment-summary.mjs
        env:
          DEPLOY_SUMMARY_JSON: >-
            {"title":"Web — branch preview","rows":[
              ["Preview","[${{ steps.preview_url.outputs.url }}](${{ steps.preview_url.outputs.url }})"],
              ["Pages branch","`${{ steps.branch.outputs.name }}`"],
              ["Git branch","`${{ github.ref_name }}`"],
              ["Version","`${{ steps.buildmeta.outputs.version }}`"],
              ["Commit","[\\`${{ steps.buildmeta.outputs.sha }}\\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.buildmeta.outputs.sha }})"],
              ["Staging","Unchanged — push to `main` updates [gwenda-staging.pages.dev](https://gwenda-staging.pages.dev)"]
            ]}
