[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gwenda-event-invites"
version = "0.1.0"
description = "Send special-event invites from a ClickUp guest list (email + Instagram)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
event-invites = "gwenda_event_invites.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
